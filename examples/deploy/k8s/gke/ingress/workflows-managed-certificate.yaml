# Google-managed TLS certificate for `NAVIGATOR_WORKFLOWS_HOST`
# — the hostname Restate Cloud uses to reach `workflows-service`.
#
# Attached to the shared `navigator-web-gke` Ingress alongside the
# per-family web certificates via a comma-separated value in the
# `networking.gke.io/managed-certificates` annotation. Each cert
# covers exactly one hostname family so that revocations, domain
# changes, or a DNS miss reissue only that family.
#
# See `ingress/managed-certificate.yaml` for the broader story
# about ManagedCertificate vs Certificate Manager and the HTTP-01
# challenge gotcha (DNS must resolve to the LB's IP before the
# challenge can complete).
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: navigator-workflows
  namespace: navigator
spec:
  domains:
    - NAVIGATOR_WORKFLOWS_HOST
