head_title: "{site_name} | Home"
meta_description: >-
  Everyone deserves to be seen. Litigation for the wrongly accused and the
  wronged: personal injury, divorce, business divorce, and criminal
  investigations.
heading: Everyone deserves to be seen.
lead: >-
  We fight for people who have been wrongly accused, and for people who were
  wronged and handed no form to put it on. We move fast and judiciously, because
  being heard late is its own injury.
contact_label: Contact us
hero:
  alt: New York City skyline at sunset, viewed from above Lower Manhattan.
  asset: img/new-york/new-york.png
service:
  heading: We are by your side through tough times.
  body:
    - - text: >-
          We stand with people who have been wrongly accused, and with people
          against whom a real wrong was committed and no form was ever written
          for it. Personal injury. Divorce, and the business divorce that looks
          nothing like it on paper and exactly like it in the room. Criminal
          investigations, from the first letter onward.
    - - text: "We move fast and judiciously, and the "
      - text: litigation practice
        href: /litigation
      - text: " states the method: do as much as we can, as early as we can, and get to a resolution sooner. Speed is not the point of it. A person who is not seen loses ground whether or not the case is close, and moving early is how we keep that from happening quietly."
    - - text: >-
          Every problem is unique. As long as we are not conflicted out, we will
          listen to your story, surround ourselves with the experts it needs, and
          do everything we can when everything is on the line.
    - - text: >-
          The rest of what we do exists because litigation taught us to build
          it: the systems, the discipline, and the habit of writing everything
          down. Whatever brings you in, the work runs the same way.
practices_heading: Our complementary practice
practices:
  - mark: technology
    heading: Fractional CTO
    body: >-
      We run the technology function for law firms: the architecture, the AI
      tooling, and the privacy and compliance work under both. The same systems
      we litigate on.
    href: /fractional-cto
  - mark: handshake
    heading: Fractional GC
    body: >-
      Company counsel on one flat monthly fee, working at the pace your sales
      cycle already runs at: contracts, licences, financings, and the corporate
      advice under them.
    href: /fractional-gc
  - mark: gavel
    heading: One-Time Services
    body: >-
      The routine matters a person or a company walks in with: a will, a trust,
      a formation, a trademark, an annual report. One scope and one flat fee,
      agreed before we start.
    href: /services
