head_title: "{site_name} | Personal plan"
meta_description: >-
  A Personal plan from Neon Law for help with taxes and personal information,
  for $365 per year.
title: "{shared:personal_plan.eyebrow}"
hero_mark: technology
tagline: "{shared:personal_plan.title}"
hero_lines:
  - text: "{shared:personal_plan.title}"
    accent_words: 1
hero_lead: >-
  You do not have to handle everything alone. Get help with your taxes and
  personal information.
hero_cta:
  href: "mailto:{firm_email}"
  label: Contact us
skin: practice
bands:
  - kind: cards
    anchor: virtues
    overline: Why it works
    heading: Warm, clear help.
    description: ""
    items:
      - title: Your information
        body:
          - - text: >-
                We help you understand the next step for your taxes and your
                personal information.
      - title: Your questions
        body:
          - - text: >-
                We explain what is included and what may cost extra before we
                begin additional work.
      - title: A lawyer's review
        body:
          - - text: >-
                A licensed attorney reviews the work.
  - kind: cards
    anchor: plan
    overline: Personal Legal Plan
    heading: One annual price
    description: >-
      The Personal plan is $365 per year, about $1 a day. Work outside the
      plan and government fees cost extra. We will explain the cost before we
      begin additional work.
    pricing_style: true
    items:
      - title: Personal plan
        chips:
          - "{shared:personal_plan.price}"
        cadence: /year
        body:
          - - text: "About $1 a day for help with taxes and personal information."
        features:
          - Help with federal and state tax filings
          - "{shared:personal_plan.included.data_removal}"
          - "{shared:personal_plan.included.credit_monitoring}"
        href: "mailto:{firm_email}"
        href_label: Contact us
        day_rate_bill: 1
  - kind: cards
    anchor: included
    overline: What's included
    heading: Three ways we can help
    description: ""
    items:
      - title: Taxes
        body:
          - - text: >-
                Help with federal and state tax filings. We will explain what
                information we need and whether additional work costs extra.
      - title: Personal information
        body:
          - - text: >-
                Requests to companies that hold your personal data, asking
                them to remove it. We cannot promise that every company will
                remove every record.
      - title: Optional credit monitoring
        body:
          - - text: >-
                Choose whether to opt in. We will explain setup, coverage, and
                any additional cost before you enroll.
  - kind: cta
    heading: Ready to get help?
    body: >-
      Email the firm to ask whether the Personal plan fits your needs.
    email: "{firm_email}"
    email_subject: Personal Plan
