name: CodeQL

# CodeQL security code scanning, owned in-repo as a regular Actions workflow
# (advanced setup) rather than GitHub's managed "Code Quality" default setup.
# Owning the workflow is what lets us scan Rust — the managed setup only offers
# JavaScript/TypeScript — and pin the trigger.
#
# Runs on pull requests targeting `main` and on pushes to `main`. The PR scan is
# the merge gate; the post-merge scan keeps the default-branch alert inventory
# current after a change lands.
#
# The managed "Code Quality analysis" toggle (Settings -> Security and quality)
# must be turned OFF once this lands, or both configurations scan in parallel.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# One in-flight run per PR or default-branch push; a new revision cancels the
# superseded scan.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # `actions: read` lets the analyze step read this workflow run's metadata
  # (GET /actions/runs/:id) while combining and uploading SARIF; without it the
  # explicit block defaults that scope to `none` and the upload 403s.
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both languages scan with build-mode `none` (no compilation): JS/TS
          # is interpreted, and CodeQL's Rust support scans source without a
          # cargo build (GA since Oct 2025).
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
