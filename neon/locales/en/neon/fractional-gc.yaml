head_title: "{site_name} | Business plan"
meta_description: >-
  Ongoing legal help for your business, including contracts, hiring, company
  records, and paperwork, for $3,650 per year.
eyebrow: Business plan
heading:
  text: A lawyer for your business.
  accent_words: 1
lead: >-
  Get help with contracts, hiring, and the paperwork that comes with running a
  business.
cta_label: Ask about joining
virtues:
  - word: Clear
    body: >-
      We explain what is included, what costs extra, and what we need from you
      before work begins.
  - word: Practical
    body: >-
      Get help with the records, forms, contracts, and recurring paperwork that
      keep your business moving.
  - word: Responsive
    body: >-
      A lawyer answers your questions within three business days. Tell us when
      something is urgent so we can discuss the right next step.
fee_heading: One annual price
fee_body: >-
  The Business plan is $3,650 per year. That is about $10 a day. Work outside
  the plan, custom contract reviews, and government fees cost extra. We will
  explain the cost before we begin additional work.
pricing:
  - title: Business plan
    price: "$3,650"
    cadence: /year
    blurb: >-
      About $10 a day for ongoing help with the legal side of your business.
    features:
      - Help keeping your company records up to date
      - Forms for hiring employees and contractors
      - Answers from a lawyer within three business days
      - Help keeping track of who owns your company
      - Forms for keeping business information private and working with customers
      - Help with business taxes and state paperwork
      - Custom contract reviews cost extra, from $100 to $500 depending on the contract
      - DocuSign sent & tracked for you at $5 per contract
    day_rate_bill: 10
closing_heading: Ready for ongoing legal help?
closing_body: Ask us whether the Business plan fits your company.
closing_email: "{firm_email}"
