# The firm's individual services, as structured records.
#
# This is the machine-readable twin of the prose cards in `services.yaml`: the
# same work, carrying the identifiers, item numbers, categories, keywords, and
# fees a reader can search and a consumer can pin. `views::locales::services`
# is the typed check `navigator project gate` runs over it (Y002), and
# `cli/examples/export-services-catalog.rs` publishes it as an
# integrity-checked artifact the way `shared.yaml` is published.
#
# Fees, item codes, service names, and `includes` scope lines are attorney-set.
# A Notation package has an a la carte price and may have a price for a named
# plan. The catalog validates that every published plan price is at least half
# off its package's a la carte price.
catalog_version: 2

# What a `flat_fee` service costs. Both flat-fee kinds resolve to this one
# figure, so the page cannot print two different "flat fees".
flat_fee: "$100"

# The closed category vocabulary, and the words a reader sees for each. A
# service naming anything outside this list is refused.
categories:
  - value: company
    label: Start a business
  - value: compliance
    label: Run a business
  - value: identity
    label: Names & brands
  - value: estate
    label: Wills & family plans
  - value: contracts
    label: Contracts & forms
  - value: urgent
    label: Disputes & housing

services:
  - id: llc-file
    template: nv__llc_formation
    item: "1101"
    name: Start a company
    blurb: >-
      We help you set up a limited liability company, also called an LLC. A
      lawyer checks your papers before we file them with the state.
    category: company
    flat_fee: form
    period: per form
    state_fee: true
    includes:
      - Check that your business name is available
      - Prepare the papers to create your company
      - Have a lawyer check and file the papers
    related:
      - llc-launch
      - nv-address
      - annual-report
    keywords:
      - LLC
      - articles of organization
      - formation
      - File

  - id: llc-launch
    item: "1102"
    name: Business formation paperwork
    blurb: >-
      Set up your limited liability company and get the ownership agreement and
      tax ID a bank will usually ask for.
    category: company
    amount: "$100"
    period: per package
    state_fee: true
    package:
      of:
        - llc-file
      extras:
        - name: An agreement between the owners
          amount: "$100"
        - name: A federal tax ID for your business
          amount: "$100"
    plan_price:
      amount: "$25"
      plan: Business plan
    includes:
      - Set up your limited liability company
      - An agreement between the owners
      - A federal tax ID for your business
    related:
      - nv-address
      - annual-report
      - nda
    keywords:
      - LLC
      - EIN
      - operating agreement
      - formation
      - Launch

  - id: nonprofit
    template: nv__nonprofit_501c3_formation
    item: "1103"
    name: Start a nonprofit
    blurb: >-
      Set up your nonprofit and apply for federal tax exemption. Government fees
      are separate.
    category: company
    flat_fee: form
    period: per form
    state_fee: true
    includes:
      - Papers to set up the nonprofit and explain how it runs
      - Rules for handling personal interests in nonprofit decisions
      - Prepare and file the application for federal tax exemption
    related:
      - nv-address
    keywords:
      - 501(c)(3)
      - Form 1023
      - bylaws
      - conflict-of-interest policy

  - id: annual-report
    template: nv__annual_report
    item: "1201"
    name: Renew your Nevada business paperwork
    blurb: >-
      We file your company's yearly report and renew its state business license.
    category: compliance
    flat_fee: form
    period: per form
    state_fee: true
