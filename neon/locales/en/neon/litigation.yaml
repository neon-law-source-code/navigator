head_title: "{site_name} | Disputes"
meta_description: >-
  Start with a free consultation to talk about a dispute, what happened, what
  you need, and any deadline.
eyebrow: "{shared:litigation.eyebrow}"
heading:
  text: "{shared:litigation.title}"
  accent_words: 1
lead: "{shared:litigation.lede}"
cta_label: "{shared:litigation.cta}"
body:
  - - text: >-
        If you want to sue someone or someone is suing you, tell us your story.
        We will talk about what you want to change and whether we can help. You
        do not need a subscription for this first conversation.
  - - text: "{shared:litigation.cases_help_others}"
  - - text: >-
        If we can take your case, we will explain what we can do and what it
        costs before you decide.
