meta_description: >-
  Vesta Estate Planning is a practice of Shook Law PLLC. Wills, trusts, powers
  of attorney, advance directives, and probate, at flat fees quoted before any
  work begins. This is an attorney advertisement.
heading: Decide now who receives what.
lead: >-
  Vesta Estate Planning is a practice of Shook Law PLLC. We help people say who
  should receive what when they die, and who can act for them if they cannot
  act for themselves. We tell you the fee before any work begins. Nothing here
  is legal advice without a signed retainer for an active project.
contact_label: Contact us
service:
  heading: What this practice does
  body:
    - - text: >-
          We prepare wills, living trusts, financial powers of attorney, and
          advance directives, and we handle probate after someone has died. A
          licensed attorney prepares and reviews the work. Shook Law PLLC is
          the law firm you would retain.
    - - text: "A will starts at "
      - text: "$3,000"
        emphasis: true
      - text: >-
          . A living trust starts at $3,000. An estate plan bringing together a
          will, a document naming someone to handle your finances, and your
          wishes for medical care is $5,000. Court filing fees and recording
          fees are set by the government and are separate from our fee.
    - - text: >-
          A will does not avoid probate. It tells the court who should receive
          what. Whether an estate goes through probate at all, and how long
          that takes, depends on what the person owned and how it was held. We
          will explain what applies to yours.
    - - text: >-
          There is no deadline here that we invented. People usually do this
          when something changes — a birth, a marriage, a house, a diagnosis —
          and any of those is a reasonable time to start.
    - - text: "Write to "
      - text: "{firm_email}"
        href: "mailto:{firm_email}"
      - text: >-
          . Tell us roughly what you would like to arrange, and we will explain
          the first step and what it costs.
practices_heading: The work
