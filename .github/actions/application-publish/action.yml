name: navigator application publish
description: >-
  Publish a Project portal's built bundle to its deployment's private
  applications bucket, hashed assets first and index.html last, deleting
  nothing.

# The publish half of a Project repository's CI, downstream of the one gate.
#
# `neon-law-source-code/navigator/.github/actions/validate@YY.M.D` with
# `project_repository: true` is the source-only, no-legal-files gate, and it
# also proves the built portal is mounted at `/app/projects/<code>/portal/`.
# This action runs AFTER that gate, in the same job, and moves the bytes: it
# authenticates to the deployment's GCP project through Workload Identity
# Federation and uploads `dist/` to `<code>/portal/` in the private
# `<deployment>-applications` bucket that Navigator streams from.
#
# It is consumed identically by every Project repository in every organization,
# so it names no organization, host, or client. The only things it cannot
# derive are the three per-deployment coordinates the caller passes as
# repository *secrets* — the bucket, the Workload Identity provider, and the
# publisher service account. The Project code is read from the repository's own
# root `navigator.yaml` manifest (`project:`), the same file and key
# `store::sample_project::MANIFEST_FILE` and `navigator projects drift` read;
# the `repository:` input falls back to `github.event.repository.name` only
# when a checkout carries no manifest.
#
# ## Why those three are secrets: disclosure reduction, NOT access control
#
# Read this before changing anything below, because the obvious reading is the
# wrong one.
#
# A provider resource name, a service-account email, and a bucket name are
# public identifiers. Knowing them grants nothing.
# **The Workload Identity binding on Google's side is the access control, and
# it is the only one.** A reader who learns the project id cannot use it.
#
# They are secrets, and this action masks their components, for a narrower
# reason: two of the three carry the deployment's GCP project identity in their
# own text — the service-account email *is* the project id
# (`nav-pub-<code>@<project>.iam.gserviceaccount.com`) and the provider
# resource *is* the project number (`projects/<number>/locations/global/...`) —
# and the bucket name is `<deployment>-applications`, so it names the deployment.
# The Project repositories consuming this action are public and so are their
# Actions logs. GitHub redacts secrets from logs and does not redact variables,
# so passing these as variables published a map of the organization's GCP
# topology beside every build. There is no benefit to that, so it stopped.
#
# **Nothing here is load-bearing for security, and it must not be treated as
# though it were.** If a future change needs to widen or narrow real access,
# that is the WIF binding and the publisher's IAM role — see
# `cli/src/devx/gcp/app_publisher.rs`. Do not weaken that binding believing the
# masking below compensates for it. It does not; it only keeps identifiers out
# of a public log.
#
# Consuming repository, in full (the thin caller lives in the Project repo, not
# here):
#
#     permissions:
#       contents: read
#       id-token: write            # required to mint the OIDC token WIF federates
#     steps:
#       - uses: actions/checkout@<sha>            # v7
#       - run: pnpm --dir portal install --frozen-lockfile
#       - run: pnpm --dir portal lint
#       - run: pnpm --dir portal typecheck
#       - run: pnpm --dir portal test
#       - run: pnpm --dir portal build            # Vite base /app/projects/<code>/portal/
#       - uses: neon-law-source-code/navigator/.github/actions/validate@YY.M.D
#         with:
#           version: "YY.M.D"
#           project_repository: true              # the one gate: source-only, no legal files, mounted
#       - uses: neon-law-source-code/navigator/.github/actions/application-publish@YY.M.D
#         with:
#           applications_bucket: ${{ secrets.NAVIGATOR_APPLICATIONS_BUCKET }}
#           workload_identity_provider: ${{ secrets.NAVIGATOR_APP_PUBLISHER_WIF_PROVIDER }}
#           service_account: ${{ secrets.NAVIGATOR_APP_PUBLISHER_SERVICE_ACCOUNT }}
#
# ## The issuer
#
# The tokens these repositories mint are issued by
# `https://token.actions.githubusercontent.com` — github.com's own OIDC issuer.
# The earlier wording here described it as an enterprise's own subdomain, which
# was true while these repositories lived on GitHub Enterprise and is not now.
# `cli/src/devx/gcp/artifact_registry.rs` `GITHUB_OIDC_ISSUER` has always been
# this value, so only the description was wrong.
#
# Which issuer is trusted is a property of the `workload_identity_provider`
# resource the caller passes, not a parameter this action sets.
#
# The provider id in that resource is still spelled `ghe-oidc`, and that is a
# live resource id rather than leftover narration: a provider id is not
# patchable, so renaming it would create a second provider under the same pool
# and converge nothing. `cli/src/devx/gcp/app_publisher.rs`
# `APP_PUBLISHER_WIF_PROVIDER_ID` carries the full reasoning. Do not "fix" the
# spelling. See docs/project-repositories.md.
#
# ## Rollback
#
# There is no rollback job. A bad bundle is rolled back by reverting the change
# on the Project repository's `main` and letting the caller workflow republish
# the reverted tree — the same two-pass upload lands the previous bytes. Because
# this action never deletes, a revert is always a forward publish, never a
# recovery of something removed.

inputs:
  applications_bucket:
    description: >-
      The deployment's private applications bucket, e.g. `neon-law-applications`.
      Objects land FLAT under `<code>/portal/`. Passed from the repository secret
      `NAVIGATOR_APPLICATIONS_BUCKET`; never composed here, because the bucket is
      the one coordinate that differs between deployments. A secret rather than a
      variable because the name is `<deployment>-applications`, so it names the
      deployment in a public log — disclosure only, see the header.
    required: true
  workload_identity_provider:
    description: >-
      The full `ghe-oidc` Workload Identity provider resource, e.g.
      `projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/ghe-oidc`.
      Passed from the repository secret `NAVIGATOR_APP_PUBLISHER_WIF_PROVIDER`. It
      encodes the trusted issuer `https://token.actions.githubusercontent.com`. A
      secret rather than a variable because `<n>` is the deployment's GCP project
      number — disclosure only; the binding this resource names is the actual gate.
    required: true
  service_account:
    description: >-
      This Project's own publisher identity to impersonate,
      `nav-pub-<code>@<project>.iam.gserviceaccount.com`.
      Passed from the repository secret `NAVIGATOR_APP_PUBLISHER_SERVICE_ACCOUNT`.
      It is bound to write the applications bucket and nothing else. A secret
      rather than a variable because the email *is* the GCP project id —
      disclosure only, see the header.
    required: true
  repository:
    description: >-
      Fallback Project code and object prefix, used only when the checkout's
      root `navigator.yaml` carries no `project:`. The manifest is the source
      of truth; this input exists for a checkout that does not have one yet.
      Defaults to the current repository's name.
    required: false
    default: ${{ github.event.repository.name }}
  dist_dir:
    description: >-
      The built bundle to publish, relative to the workspace. Defaults to
      `portal/dist`; pass `dist` for a repository whose portal is the root.
    required: false
    default: "portal/dist"

runs:
  using: composite
  steps:
    # FIRST, before anything can print. Disclosure reduction only — see the
    # header; this is not the access control and must not be mistaken for it.
    #
    # Passing the three coordinates as secrets gets GitHub to redact those three
    # exact strings. It does NOT redact the identifiers *inside* them, because
    # redaction matches exact substrings of a registered secret and not the other
    # way round: `gcloud` prints the bare project id and project number on their
    # own (the configured project, an error message, a resource URL), and neither
    # is the whole of any registered secret. So the components are registered
    # here too, decomposed from the inputs.
    #
    # The bucket is registered as well. It is already a secret, so this is
    # belt-and-braces — but the migration of the three coordinates from
    # repository variables to repository secrets happens in each calling
    # repository's settings, not here, and until a given repository has been
    # migrated its bucket still arrives as an unredacted variable. This step
    # covers that window and costs nothing after it closes.
    #
    # `::add-mask::` on an empty string is an error, and a too-short value would
    # redact unrelated text, so each is guarded. A value that cannot be
    # decomposed is skipped rather than failing the publish: masking is
    # best-effort by nature, and refusing to publish because a coordinate had an
    # unexpected shape would trade a real capability for a cosmetic one.
    - name: mask the deployment coordinates in this job's log
      shell: bash
      env:
        BUCKET: ${{ inputs.applications_bucket }}
        WIF_PROVIDER: ${{ inputs.workload_identity_provider }}
        SERVICE_ACCOUNT: ${{ inputs.service_account }}
      run: |
        set -euo pipefail

        mask() {
            # 6 is short enough to admit a terse project id and long enough that
            # no realistic value collides with ordinary log prose.
            if [ -n "${1:-}" ] && [ "${#1}" -ge 6 ]; then
                echo "::add-mask::$1"
            fi
        }

        # `nav-pub-<code>@<project-id>.iam.gserviceaccount.com`
        # — cli/src/devx/gcp/app_publisher.rs composes it, so the project id is
        # exactly the text between the `@` and the fixed suffix. The local part
        # differs per Project; nothing here depends on its shape.
        project_id="${SERVICE_ACCOUNT#*@}"
        project_id="${project_id%%.iam.gserviceaccount.com}"
        mask "${project_id}"

        # `projects/<project-number>/locations/global/workloadIdentityPools/...`
        project_number="${WIF_PROVIDER#projects/}"
        project_number="${project_number%%/*}"
        mask "${project_number}"

        mask "${BUCKET}"

        # Deliberately no confirmation of *what* was masked: echoing the count is
        # harmless, echoing the values would defeat the step.
        echo "registered log masks for the deployment coordinates"

    # The Project reads its own code from its root `navigator.yaml` manifest —
    # the same file and `project:` key `store::sample_project::MANIFEST_FILE`
    # and `navigator projects drift` read. `repository:` (the `inputs.repository`
    # fallback) is used only when the checkout carries no manifest, which is why
    # it still defaults to the repository name.
    #
    # The manifest's `project:` is not re-validated as a slug here: the mount
    # check just below is what refuses a wrong or malformed code, because the
    # object prefix must match the Vite base the portal was actually built
    # with. A declared code the gate would reject fails there, before this
    # action ever runs.
    - name: derive the coordinate and verify the built mount
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        DIST_DIR: ${{ inputs.dist_dir }}
      run: |
        set -euo pipefail

        code=""
        if [ -f "navigator.yaml" ]; then
            code="$(awk -F': *' '/^project:[[:space:]]*/ { print $2; exit }' navigator.yaml \
                | tr -d '"' | xargs || true)"
        fi
        if [ -z "${code}" ]; then
            code="${REPOSITORY}"
        fi
        if [ -z "${code}" ]; then
            echo "::error::no navigator.yaml project: and no repository name to derive the Project code from."
            exit 1
        fi

        # cloud::workspace::WorkspaceConfig::portal_mount. `portal` is a
        # literal segment and the trailing slash is the served form.
        base="/app/projects/${code}/portal/"

        index="${DIST_DIR}/index.html"
        if [ ! -f "${index}" ]; then
            echo "::error::${index} is missing; build the portal before this action runs."
            exit 1
        fi

        # The base must already have reached the build. The validate gate proves
        # this too; re-checking here refuses to publish an unmounted bundle even
        # if a caller reordered its steps.
        if ! grep -q "\"${base}assets/" "${index}"; then
            echo "::error::${index} is not mounted at ${base} — the Vite base did not reach the build."
            exit 1
        fi

        # No legal file may enter the applications bucket. The source-only,
        # no-legal-files proof is the validate gate; this is a last check over
        # the exact bytes about to be uploaded. A Project's notation blueprints
        # are `templates/<code>.md` — Markdown — and build output carries none,
        # so a `.md` file inside `dist/` is a legal-source leak, not an asset.
        if leaked="$(find "${DIST_DIR}" -type f -name '*.md' -print 2>/dev/null)" \
            && [ -n "${leaked}" ]; then
            echo "::error::Markdown found under ${DIST_DIR}; legal source must never enter the applications bucket."
            printf '%s\n' "${leaked}" >&2
            exit 1
        fi

        {
            echo "code=${code}"
            echo "prefix=${code}/portal"
        } >> "${GITHUB_OUTPUT}"
        echo "publishing ${DIST_DIR} → <bucket>/${code}/portal (mount ${base})"
      id: coord

    # Keyless federation. The caller grants `id-token: write`; this mints a
    # short-lived OIDC token from the enterprise issuer and exchanges it for a
    # credential impersonating the publisher. No service-account key exists.
    # Pinned `@v3` to match every `google-github-actions/auth` call in this
    # repository's deploy.yml and promote.yml.
    - name: authenticate to GCP through Workload Identity Federation
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: set up the gcloud CLI
      uses: google-github-actions/setup-gcloud@v3

    # Upload order is load-bearing, and the applications bucket adds a second
    # rule the marketing sites do not have: it is private, shared across every
    # Project, and served object-by-object by Navigator, so a publish NEVER
    # deletes. `cp` cannot delete, so a stale hashed asset is left unreachable
    # rather than removed, and one Project's publish can never prune another's
    # objects out of the flat namespace.
    #
    # ## Why `cp` and not `rsync`
    #
    # Two independent reasons, and both are load-bearing. Do not "optimize" this
    # back to `gcloud storage rsync` for speed.
    #
    # 1. **Retention.** The bucket carries an object-age Delete rule —
    #    `cli/src/devx/gcp/buckets.rs`, `APPLICATIONS_RETENTION_DAYS`. An upload
    #    that skips unchanged objects leaves a live asset's age running while
    #    `index.html` keeps naming it, so the entry document outlives the assets
    #    it points at and the portal serves a blank page. `rsync` skips
    #    unchanged objects by definition; `cp` rewrites every object every
    #    publish, which is what keeps a live asset's age at zero.
    # 2. **Least privilege.** `rsync` compares against the destination, so it
    #    needs `storage.objects.list` — and that permission is evaluated against
    #    the *bucket*, never an object, so no prefix condition can scope it. It
    #    would hand every Project's CI the ability to enumerate every other
    #    Project's object names in this shared bucket. `cp` never lists, so the
    #    publisher needs only prefix-conditioned create/update.
    #
    # Pass 1 — everything except index.html, so that by the time any HTML naming
    # a new hashed filename is readable, that file already exists.
    #
    # ## Why the two quieting levers, and why both
    #
    # `gcloud storage cp` narrates itself object by object — `Copying
    # file://... to gs://<bucket>/<prefix>/...` — so the bucket name reaches the
    # log once per file even though nothing in this action echoes it.
    # `CLOUDSDK_CORE_VERBOSITY=error` drops gcloud's informational output
    # wherever it originates, including from libraries this action does not call
    # directly; `--no-user-output-enabled` suppresses the progress narration on
    # the specific command. Neither subsumes the other, and both leave failures
    # intact: errors print at `error` verbosity, and `set -euo pipefail` still
    # fails the step on a non-zero exit, so a broken publish is as loud as before.
    - name: publish assets (everything but index.html)
      shell: bash
      env:
        BUCKET: ${{ inputs.applications_bucket }}
        PREFIX: ${{ steps.coord.outputs.prefix }}
        DIST_DIR: ${{ inputs.dist_dir }}
        CLOUDSDK_CORE_VERBOSITY: error
      run: |
        set -euo pipefail

        # `gcloud storage cp --recursive <dir> <dst>` NESTS the directory: it
        # writes `<prefix>/dist/assets/...`, which Navigator does not serve. A
        # trailing slash on the source does not change that. Uploading the
        # directory's *entries* is what merges them, so `assets/` lands at
        # `<prefix>/assets/`. This is also how index.html is held back: `cp`
        # has no `--exclude`, so it is filtered out of the entry list here and
        # uploaded by the next step instead.
        shopt -s dotglob nullglob
        entries=()
        for entry in "${DIST_DIR}"/*; do
            if [ "$(basename "${entry}")" = "index.html" ]; then
                continue
            fi
            entries+=("${entry}")
        done

        if [ "${#entries[@]}" -eq 0 ]; then
            echo "::error::${DIST_DIR} holds nothing but index.html; the build produced no assets."
            exit 1
        fi

        gcloud storage cp --no-user-output-enabled --recursive "${entries[@]}" "gs://${BUCKET}/${PREFIX}/"
        echo "published ${#entries[@]} entries from ${DIST_DIR} → <bucket>/${PREFIX}/"

    # Pass 2 — index.html LAST, once every asset it names is already in place.
    - name: publish index.html last
      shell: bash
      env:
        BUCKET: ${{ inputs.applications_bucket }}
        PREFIX: ${{ steps.coord.outputs.prefix }}
        DIST_DIR: ${{ inputs.dist_dir }}
        CLOUDSDK_CORE_VERBOSITY: error
      run: |
        set -euo pipefail
        gcloud storage cp --no-user-output-enabled "${DIST_DIR}/index.html" "gs://${BUCKET}/${PREFIX}/index.html"

    # Stamp the entry point with the provenance of the publish, so an operator
    # reading the served object knows the commit and moment it came from. gcloud
    # stores each as GCS custom metadata, surfaced as `x-goog-meta-<key>`.
    #
    # The metadata written is unchanged; only the reporting is quieter. The
    # closing line prints the literal `<bucket>` rather than the value, the same
    # shape the derive step above uses, so the provenance an operator actually
    # needs — commit and build time — survives without the deployment's bucket
    # name travelling with it into a public log.
    - name: stamp index.html with build provenance
      shell: bash
      env:
        BUCKET: ${{ inputs.applications_bucket }}
        PREFIX: ${{ steps.coord.outputs.prefix }}
        COMMIT: ${{ github.sha }}
        REPO_FULL: ${{ github.repository }}
        REF: ${{ github.ref }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        CLOUDSDK_CORE_VERBOSITY: error
      run: |
        set -euo pipefail
        build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        gcloud storage objects update --no-user-output-enabled "gs://${BUCKET}/${PREFIX}/index.html" \
            --custom-metadata="commit=${COMMIT},build-time=${build_time},repository=${REPO_FULL},ref=${REF},run-id=${RUN_ID},run-attempt=${RUN_ATTEMPT}"
        echo "stamped <bucket>/${PREFIX}/index.html · commit ${COMMIT} · ${build_time}"
