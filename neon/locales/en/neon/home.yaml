head_title: "{site_name} | Home"
meta_description: >-
  Impact litigation, company counsel, a personal legal plan, and one-time
  filings. We take cases of every kind. Come in. We will listen.
heading: Everyone deserves to be seen.
lead: >-
  Come in with the case you have. We take cases of every kind. The work we care
  about most is impact litigation: work whose point is to make a person's life
  better, and the lives of people in the same position. We listen, we move
  early, and we work as a team. That is how we work. It is not a promise about
  a result.
contact_label: Contact us
hero:
  alt: New York City skyline at sunset, viewed from above Lower Manhattan.
  asset: img/new-york/new-york.png
service:
  heading: You have a place here.
  body:
    - - text: "The "
      - text: "litigation practice "
        href: /litigation
      - text: >-
          is plaintiff and defense. We take the case that walks in, as long as
          we are not conflicted out. The work we seek is the dispute that
          changes a person's situation, and that can change it for people like
          them.
    - - text: "We work as a team. You can "
      - text: meet us
        href: /team
      - text: >-
          , and we bring in the specialists a matter needs. Speed is how we
          work. A person who is not heard loses ground whether or not the case
          is close. Moving early is how we keep that from happening quietly.
    - - text: >-
          We are also company counsel, a personal legal plan, and the lawyers
          for a will, a formation, or a filing. That work is the rest of the
          firm, not a sideline. Pick the door that fits.
practices_heading: The whole practice
practices:
  - mark: scales
    heading: Litigation
    body: >-
      Impact litigation, and every other dispute that walks in. Plaintiff and
      defense. We listen first.
    href: /litigation
  - mark: handshake
    heading: Fractional GC
    body: >-
      Ongoing company counsel on one flat annual or daily fee: contracts,
      licences, financings, and the advice under them, at the pace the sales
      cycle already runs.
    href: /fractional-gc
  - mark: technology
    heading: Personal Plan
    body: >-
      Tax filing, privacy protection, and credit monitoring (beta), on one
      flat annual or daily fee.
    href: /personal-plan
  - mark: gavel
    heading: One-Time Services
    body: >-
      A will, a trust, a formation, a trademark, an annual report. One scope
      and one flat fee, agreed before we start. Requires an active Fractional
      GC or Personal Plan.
    href: /services
