head_title: "{site_name} | Divorce counsel for $10 a day"
meta_description: >-
  Daybridge Divorce Law is operated by Shook Law PLLC. Divorce counsel is $10
  a day while the firm is retained. Court filing fees, service fees, and
  other case costs are separate. Attorney advertisement.
heading: A way through divorce.
lead: >-
  Clear next steps, prompt answers, and motion drafts prepared on a defined
  schedule. We want to help you finish the work, not stay stuck in it.
contact_label: Start a conversation
practices_heading: ""
practices: []
daybridge:
  eyebrow: Daybridge Divorce Law
  fee_label: Attorney fee
  fee_price: "$10"
  fee_unit: / day
  fee_body: >-
    The attorney fee is $10 for each day we are retained. Finish sooner and
    you pay less in attorney fees.
  fee_note: >-
    Court filing fees, service fees, and other case costs are separate. Your
    written retainer defines when billing starts and stops and what work is
    included.
  response_heading: Answers as soon as possible
  response_body: >-
    Send your question through the channel in your retainer. We respond as
    soon as possible and tell you when an issue needs more time or information.
  motions_heading: First drafts within five business days
  motions_body: >-
    When motion practice is within our agreed scope, we prepare a first draft
    within five business days after receiving the information and documents
    we need, unless we agree to a different schedule in writing.
  costs_heading: You pay case costs separately
  costs_body: >-
    Filing, service, transcript, expert, and similar third-party charges are
    not part of the $10 daily attorney fee. We explain anticipated costs before
    incurring them when practicable.
  process_label: The way forward
  process_heading: One useful step at a time.
  steps:
    - - Tell us where things stand
      - >-
        Share the papers, dates, and decisions in front of you. We check scope
        and conflicts before an attorney-client relationship begins.
    - - Agree on the work
      - >-
        Your written retainer identifies the work, when the daily fee begins,
        and which costs you pay separately.
    - - Move toward the other side
      - >-
        We answer questions, prepare the agreed work, and keep the next step
        visible until the engagement is complete.
  closing_heading: Ready for the next step?
  closing_body: >-
    Tell us what is happening and what deadline is closest. We will tell you
    whether Daybridge can help and what we need to begin.
