head_title: "Plans & services — {site_name}"
meta_description: >-
  Choose a plan for regular legal help, ask about an individual service, or
  start a free consultation for a dispute.
title: "{shared:services.eyebrow}"
hero_mark: gavel
tagline: "{shared:services.title}"
hero_lines:
  - text: "{shared:services.eyebrow}"
    accent_words: 0
hero_lead: "{shared:services.lede}"
hero_cta:
  href: "mailto:{firm_email}"
  label: Contact us
skin: practice
bands:
  - kind: statement
    heading: "{shared:services.subscriptions_heading}"
    lead: >-
      Choose a plan for ongoing help with your business or personal legal
      needs. Individual services are also available when you need help with
      one thing.
    body:
      - - text: "See the "
        - text: Business plan
          href: /business
        - text: " or "
        - text: Personal plan
          href: /personal
        - text: >-
            . Business-plan access is $10 a day. An unchanged template can be
            sent for signature for $5. A Notation we prepare or revise begins
            at $100. Estate planning starts at $3,000. A Notation package
            costs less than buying each included Notation on its own.
            Government fees are separate.
      - - text: >-
            Each Notation has an agreed scope and price before work begins.
      - - text: "Have a dispute? Start with a "
        - text: free consultation
          href: /disputes
        - text: ". You do not need a subscription for that first conversation."
  - kind: services
    anchor: fees
    overline: Individual services
    heading: "{shared:services.catalog_heading}"
    description: >-
      Choose the help you need. We will explain what it includes and what it
      costs before work starts. Government fees are separate. A Notation we
      prepare or revise begins at $100. Estate planning starts at $3,000.
      A Notation package costs less than buying each included Notation on
      its own.
    search_label: Search individual services
    search_placeholder: A contract, my business, a will, a dispute
    submit_label: Search
    examples:
      - label: My business
        query: business
      - label: A contract
        query: contract
      - label: My family
        query: family
      - label: A dispute
        query: dispute
    fee_label: Legal fee
    includes_label: What this includes
    package_badge: Notation package
    package_separate_label: Bought separately
    package_save_suffix: less than buying each Notation on its own
    members_badge: Plan required
    state_fee_badge: Government fees cost extra
    empty: We could not find a match.
    empty_help: >-
      Tell us what you need and we will let you know whether we can help.
    clear_label: Show all services
  - kind: steps
    anchor: how
    overline: How it works
    heading: How it works
    description: >-
      Tell us what you need. We will explain the service, its cost, and what we
      need from you before work begins.
    items:
      - title: Create an account
        body:
          - - text: Set up your account so everything about your matter lives in one place.
      - title: Answer some questions
        body:
          - - text: A short questionnaire, scoped to what your filing actually needs.
      - title: Upload your documentation
        body:
          - - text: Add the documents your matter calls for; we tell you which ones.
      - title: We complete the work we agree on
        body:
          - - text: A licensed attorney reviews the work and we keep you informed.
  - kind: cta
    heading: Tell us what you need.
    body: >-
      If you are not sure which service fits, email us. We will help you choose
      your next step.
    email: "{firm_email}"
    email_subject: Legal Services
