head_title: "Accidents and injury claims | {site_name}"
meta_description: >-
  Injury claims are offered through Misericordia Injury Law, a Shook Law
  PLLC practice: car, truck, motorcycle, pedestrian, premises, and wrongful
  death claims. The first conversation is free, and the fee is a percentage
  of what is recovered.
title: Accidents and injury claims
tagline: Talk to a lawyer after an injury.
hero_mark: scales
hero_lead: >-
  Car, truck, motorcycle, pedestrian, premises, and wrongful death claims are
  handled through Misericordia Injury Law, a Shook Law PLLC practice. The
  first conversation is free, and the fee is a percentage of what is
  recovered, agreed in writing before work begins — there is no attorney's
  fee unless something is recovered. We do not promise a recovery amount or
  how quickly a claim resolves.
