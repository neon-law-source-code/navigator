name: project-gate

# Reusable gate for a Project repository. A Project's own `ci.yml` is a thin
# caller pinned to an exact release tag of this file:
#
#     jobs:
#       ci:
#         uses: neon-law-source-code/navigator/.github/workflows/project-gate.yml@YY.M.D
#         secrets: inherit
#         with:
#           version: "YY.M.D"
#
# The pin *is* the version: this workflow downloads that CLI tag and runs
# `navigator validate`. It does not resolve `latest`. There is no schedule.
# `ops github setup` bumps the caller's pin; it never edits this file.

on:
  workflow_call:
    inputs:
      version:
        description: Exact Navigator release tag to download and run.
        required: true
        type: string
      host:
        description: Deployment host for live document verification on push to main.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
      - name: Install application dependencies
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_manifests=(apps/*/package.json)
          if [ -f portal/package.json ]; then
              package_manifests+=(portal/package.json)
          fi
          if [ -f package.json ] && { [ -f vite.config.ts ] || [ -f vite.config.js ]; }; then
              if [ ! -f portal/package.json ] && [ ! -f apps/portal/package.json ]; then
                  package_manifests+=(package.json)
              fi
          fi
          for package_json in "${package_manifests[@]}"; do
              app_dir="${package_json%/package.json}"
              pnpm --dir "${app_dir}" install --frozen-lockfile
          done
      - name: Lint applications
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_manifests=(apps/*/package.json)
          if [ -f portal/package.json ]; then
              package_manifests+=(portal/package.json)
          fi
          if [ -f package.json ] && { [ -f vite.config.ts ] || [ -f vite.config.js ]; }; then
              if [ ! -f portal/package.json ] && [ ! -f apps/portal/package.json ]; then
                  package_manifests+=(package.json)
              fi
          fi
          for package_json in "${package_manifests[@]}"; do
              app_dir="${package_json%/package.json}"
              pnpm --dir "${app_dir}" lint
          done

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
      - name: Install application dependencies
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_manifests=(apps/*/package.json)
          if [ -f portal/package.json ]; then
              package_manifests+=(portal/package.json)
          fi
          if [ -f package.json ] && { [ -f vite.config.ts ] || [ -f vite.config.js ]; }; then
              if [ ! -f portal/package.json ] && [ ! -f apps/portal/package.json ]; then
                  package_manifests+=(package.json)
              fi
          fi
          for package_json in "${package_manifests[@]}"; do
              app_dir="${package_json%/package.json}"
              pnpm --dir "${app_dir}" install --frozen-lockfile
          done
      - name: Typecheck applications
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_manifests=(apps/*/package.json)
          if [ -f portal/package.json ]; then
              package_manifests+=(portal/package.json)
          fi
          if [ -f package.json ] && { [ -f vite.config.ts ] || [ -f vite.config.js ]; }; then
              if [ ! -f portal/package.json ] && [ ! -f apps/portal/package.json ]; then
                  package_manifests+=(package.json)
              fi
          fi
          for package_json in "${package_manifests[@]}"; do
              app_dir="${package_json%/package.json}"
              pnpm --dir "${app_dir}" typecheck
          done
      - name: Test applications
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_manifests=(apps/*/package.json)
          if [ -f portal/package.json ]; then
              package_manifests+=(portal/package.json)
          fi
          if [ -f package.json ] && { [ -f vite.config.ts ] || [ -f vite.config.js ]; }; then
              if [ ! -f portal/package.json ] && [ ! -f apps/portal/package.json ]; then
                  package_manifests+=(package.json)
              fi
          fi
          for package_json in "${package_manifests[@]}"; do
              app_dir="${package_json%/package.json}"
              pnpm --dir "${app_dir}" test
          done
      - name: Build applications
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_manifests=(apps/*/package.json)
          if [ -f portal/package.json ]; then
              package_manifests+=(portal/package.json)
          fi
          if [ -f package.json ] && { [ -f vite.config.ts ] || [ -f vite.config.js ]; }; then
              if [ ! -f portal/package.json ] && [ ! -f apps/portal/package.json ]; then
                  package_manifests+=(package.json)
              fi
          fi
          for package_json in "${package_manifests[@]}"; do
              app_dir="${package_json%/package.json}"
              pnpm --dir "${app_dir}" build
          done

  notation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download and install the navigator CLI
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${VERSION}" in
            latest|main|HEAD|"")
              echo "::error::version must be an exact release tag, not '${VERSION}'."
              exit 1
              ;;
          esac
          asset="navigator-${VERSION}-linux.tar.gz"
          tmp="$(mktemp -d)"
          gh release download "${VERSION}" \
            --repo neon-law-source-code/navigator \
            --pattern "${asset}" \
            --dir "${tmp}" \
            --clobber
          tar -xzf "${tmp}/${asset}" -C "${tmp}" navigator
          install -d "${RUNNER_TEMP}/navigator-bin"
          install -m 0755 "${tmp}/navigator" "${RUNNER_TEMP}/navigator-bin/navigator"
          echo "${RUNNER_TEMP}/navigator-bin" >> "${GITHUB_PATH}"
      - name: navigator validate
        run: navigator validate .

  documents:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download and install the navigator CLI
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${VERSION}" in
            latest|main|HEAD|"")
              echo "::error::version must be an exact release tag, not '${VERSION}'."
              exit 1
              ;;
          esac
          asset="navigator-${VERSION}-linux.tar.gz"
          tmp="$(mktemp -d)"
          gh release download "${VERSION}" \
            --repo neon-law-source-code/navigator \
            --pattern "${asset}" \
            --dir "${tmp}" \
            --clobber
          tar -xzf "${tmp}/${asset}" -C "${tmp}" navigator
          install -d "${RUNNER_TEMP}/navigator-bin"
          install -m 0755 "${tmp}/navigator" "${RUNNER_TEMP}/navigator-bin/navigator"
          echo "${RUNNER_TEMP}/navigator-bin" >> "${GITHUB_PATH}"
      - name: navigator document verify
        env:
          HOST: ${{ inputs.host }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ ! -d documents ]; then
              echo "no documents — nothing to verify"
              exit 0
          fi
          if [ -n "${HOST}" ] && [ "${EVENT_NAME}" = "push" ] && [ "${REF}" = "refs/heads/main" ]; then
              navigator document verify . --ci --host "${HOST}"
          else
              navigator document verify .
          fi

  manifest:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download and install the navigator CLI
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${VERSION}" in
            latest|main|HEAD|"")
              echo "::error::version must be an exact release tag, not '${VERSION}'."
              exit 1
              ;;
          esac
          asset="navigator-${VERSION}-linux.tar.gz"
          tmp="$(mktemp -d)"
          gh release download "${VERSION}" \
            --repo neon-law-source-code/navigator \
            --pattern "${asset}" \
            --dir "${tmp}" \
            --clobber
          tar -xzf "${tmp}/${asset}" -C "${tmp}" navigator
          install -d "${RUNNER_TEMP}/navigator-bin"
          install -m 0755 "${tmp}/navigator" "${RUNNER_TEMP}/navigator-bin/navigator"
          echo "${RUNNER_TEMP}/navigator-bin" >> "${GITHUB_PATH}"
      - name: live status
        env:
          HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail
          if [ -z "${HOST}" ]; then
              echo "no host — skip live status"
              exit 0
          fi
          navigator site projects gate --ci --host "${HOST}"

  enable-automerge:
    name: enable PR auto-merge
    permissions:
      contents: write
      pull-requests: write
    if: >
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'ready_for_review' || github.event.action == 'synchronize') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      AUTOMERGE_APP_ID: ${{ secrets.AUTOMERGE_APP_ID }}
    steps:
      - name: mint app token
        id: app-token
        if: env.AUTOMERGE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: request auto-merge
        if: env.AUTOMERGE_APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          export GH_HOST
          auto_merge_enabled="$(
              gh pr view "${PR_URL}" \
                  --json autoMergeRequest \
                  --jq '.autoMergeRequest != null'
          )"
          if [ "${auto_merge_enabled}" = "true" ]; then
              echo "auto-merge already enabled; nothing to do."
              exit 0
          fi
          pr_id="$(gh pr view "${PR_URL}" --json id --jq '.id')"
          if ! result="$(gh api graphql -f pr="${pr_id}" -f query='
              mutation($pr: ID!) {
                enablePullRequestAutoMerge(input: { pullRequestId: $pr, mergeMethod: SQUASH }) {
                  pullRequest { number }
                }
              }' 2>&1)"; then
              if printf '%s' "${result}" | grep -q 'refusing to allow a GitHub App to create or update workflow'; then
                  echo "::warning::the App was refused for lack of the \`workflows\` permission on a PR that edits workflow files. Merge this PR manually."
                  printf '%s\n' "${result}"
                  exit 0
              fi
              printf '%s\n' "${result}" >&2
              exit 1
          fi
          printf '%s\n' "${result}"

  ci:
    needs: [lint, verify, notation, documents, manifest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.verify.result }}" = "success"
          test "${{ needs.notation.result }}" = "success"
          test "${{ needs.documents.result }}" = "success"
          test "${{ needs.manifest.result }}" = "success"
