# Minimal resource requests for the `web` container. Tuned for the
# cheapest deployment that still works: GKE Autopilot will silently
# floor whatever's below its enforced minimum, but declaring the
# smallest legal values up front means we get exactly Autopilot's
# floor and no more.
#
# Bump these when CPU / memory utilization shows headroom is gone —
# Autopilot bills per requested resource, so over-asking is the easy
# way to overspend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navigator-web
  namespace: navigator
spec:
  # Two replicas, so that losing one pod is a degradation rather than an
  # outage. Autopilot reschedules pods on its own schedule — node upgrades,
  # bin-packing, preemption — and at one replica every such move is a full
  # outage with nothing left serving. That is not hypothetical: it is how
  # the 2026-08-23 production outage presented, and a single replica is
  # also why a stale image reference stayed invisible until the one pod
  # happened to move.
  #
  # This is the cheapest possible answer to that. Two of Autopilot's
  # floor-sized pods still cost very little, and the Deployment's default
  # RollingUpdate keeps one serving while the other is replaced.
  replicas: 2
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
