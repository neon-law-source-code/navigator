# SecretProviderClass — the deployment's Secret Manager object catalog.
#
# `ops secrets apply` writes every listed object to Secret Manager and applies
# the same values to the deployment's Kubernetes Secret. `ops ship` resolves
# every reference to an ENABLED `versions/latest` before it reconciles anything
# and aborts naming the gap (`ship::check_projected_objects_resolve`), and
# `deployments::tests::the_automation_home_supplies_every_object_the_manifest_references`
# fails the build when the tree would not write one. Values are written by
# `navigator ops secrets apply --deployment <name>`; see
# `docs/deployment-secrets.md`.
#
# This manifest is per-deployment. `ops ship` substitutes the project and
# namespace from the deployment being shipped, so the same embedded file
# renders one disjoint SecretProviderClass per deployment, each naming only
# that project's Secret Manager.
# `the_rendered_secret_provider_class_is_scoped_to_one_deployment` and
# `two_deployments_render_disjoint_secret_manager_coordinates` in
# `cli/src/devx/ship.rs` fail the build if a literal is ever left behind.
#
# THE OBJECT LIST BELOW IS THE SUPERSET, NOT WHAT EVERY DEPLOYMENT WRITES
# -----------------------------------------------------------------------
# One list cannot state an object that is required in one deployment and
# forbidden in another. Two kinds sit here for that reason: the Restate
# ingress pair (RESTATE_INGRESS_URL, RESTATE_AUTH_TOKEN), scoped to
# `store::deployment::GITHUB_AUTOMATION_HOME_PROJECT`, and the DocuSign
# objects, which a deployment declines by supplying no DOCUSIGN_BASE_URL. So
# `ops ship` renders the list per deployment: it drops every entry
# `ops secrets apply` reports as skipped, leaving a class
# that references exactly what that deployment writes
# (`ship::omit_unwritten_objects`). Add an object here when any deployment
# carries it; the rows that do not carry it render without it.
#
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: navigator-web
  namespace: navigator
spec:
  provider: gke
  parameters:
    # One entry per Secret Manager secret. `resourceName` pins
    # `versions/latest`; `path` is the environment-variable key that
    # `ops secrets apply` writes into the Kubernetes Secret as well.
    secrets: |
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_PASSWORD/versions/latest"
        path: "NAVIGATOR_SURREAL_PASSWORD"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SESSION_SECRET/versions/latest"
        path: "SESSION_SECRET"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/OAUTH_CLIENT_SECRET/versions/latest"
        path: "OAUTH_CLIENT_SECRET"
      # Sign in with Microsoft, a second provider next to Google. The
      # matching OAUTH_MICROSOFT_CLIENT_ID rides inline Deployment env
      # (web-env.yaml), not this rail, since it is not key material — but a
      # deployment that sets the id is a deployment that must resolve this
      # object. A deployment that declines
      # the integration (no Entra app registered) writes no
      # OAUTH_MICROSOFT_CLIENT_SECRET, so `ops secrets apply` skips it and
      # `ops ship` renders this entry out — same as the DocuSign objects
      # below.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/OAUTH_MICROSOFT_CLIENT_SECRET/versions/latest"
        path: "OAUTH_MICROSOFT_CLIENT_SECRET"
      # Sign in with Apple. The Services ID is a public Deployment env value,
      # while the Team ID, Key ID, and downloaded .p8 private key stay on the
      # deployment secret rail. A deployment that has not completed Apple
      # enrollment writes none of these optional objects.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/OAUTH_APPLE_TEAM_ID/versions/latest"
        path: "OAUTH_APPLE_TEAM_ID"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/OAUTH_APPLE_KEY_ID/versions/latest"
        path: "OAUTH_APPLE_KEY_ID"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/OAUTH_APPLE_PRIVATE_KEY/versions/latest"
        path: "OAUTH_APPLE_PRIVATE_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/RESTATE_BROKER_URL/versions/latest"
        path: "RESTATE_BROKER_URL"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/RESTATE_AUTH_TOKEN/versions/latest"
        path: "RESTATE_AUTH_TOKEN"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SENDGRID_API_KEY/versions/latest"
        path: "SENDGRID_API_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SENDGRID_FROM_EMAIL/versions/latest"
        path: "SENDGRID_FROM_EMAIL"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SENDGRID_INBOUND_SECRET/versions/latest"
        path: "SENDGRID_INBOUND_SECRET"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SENDGRID_EVENTS_SECRET/versions/latest"
        path: "SENDGRID_EVENTS_SECRET"
      # Boot invariant (web::config::enforce_deployment_invariants): the ECDSA
      # P-256 public key the /webhook/email-events endpoint verifies SendGrid's
      # event signatures against. Public material, but kept on the Secret
      # rail beside SENDGRID_EVENTS_SECRET so the two events-webhook inputs
      # rotate together. Missing this crash-loops the pod.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SENDGRID_EVENTS_PUBLIC_KEY/versions/latest"
        path: "SENDGRID_EVENTS_PUBLIC_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_CREDENTIAL_ENVIRONMENT/versions/latest"
        path: "NAVIGATOR_CREDENTIAL_ENVIRONMENT"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_ENVIRONMENT/versions/latest"
        path: "NAVIGATOR_ENVIRONMENT"
      # Per-Project GitHub repos (the production ForgeService): the org every
      # repo lives in. A boot invariant (store::deployment::WEB_REQUIREMENTS);
      # missing it crash-loops web.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_GITHUB_ORG/versions/latest"
        path: "NAVIGATOR_GITHUB_ORG"
      # The typed Project workspace coordinates (NAVIGATOR_DRIVE_*_ROOT_FOLDER_ID
      # and the shared Drive id), the three Xero ids, and DOCUSIGN_ACCESS_TOKEN
      # are deliberately absent. None of them has a value in any deployment:
      # Drive is documented but unconfigured, Xero is required only where its
      # capability is enabled, and the access token is the alternative to the
      # DocuSign JWT triple that every deployment authenticates with instead
      # (WEB_REQUIREMENTS models the pair as `any_of`, so `ops secrets apply`
      # reports the token as satisfied another way and writes nothing). Re-add
      # each alongside the deployment that first carries it, which is also what
      # keeps `ops secrets apply` able to run at all.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_FORGE_BACKEND/versions/latest"
        path: "NAVIGATOR_FORGE_BACKEND"
      # The SurrealDB coordinates. Non-secret — each deployment's
      # `config.toml` is where an operator reads and reviews them — but every
      # boot-required key that is not inline Deployment env reaches the pod
      # through `envFrom`, so they are declared here and `ops secrets apply`
      # writes them from the plaintext tree. `web` fails closed without the
      # endpoint, and the person directory lives in that engine, so a missing
      # one cannot authenticate anyone.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_ENDPOINT/versions/latest"
        path: "NAVIGATOR_SURREAL_ENDPOINT"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_NAMESPACE/versions/latest"
        path: "NAVIGATOR_SURREAL_NAMESPACE"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_DATABASE/versions/latest"
        path: "NAVIGATOR_SURREAL_DATABASE"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_PASSWORD/versions/latest"
        path: "NAVIGATOR_SURREAL_PASSWORD"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_USER/versions/latest"
        path: "NAVIGATOR_SURREAL_USER"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_ARCHIVES_BUCKET/versions/latest"
        path: "NAVIGATOR_SURREAL_ARCHIVES_BUCKET"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/RESTATE_INGRESS_URL/versions/latest"
        path: "RESTATE_INGRESS_URL"
      # Bot token for target-aware per-Project private-channel notices. This is
      # distinct from SLACK_WEBHOOK_URL, which remains the fixed-destination
      # internal ops notifier.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SLACK_BOT_TOKEN/versions/latest"
        path: "SLACK_BOT_TOKEN"
      # Dash0's bearer token is projected through the same server-side-applied
      # deployment Secret. The collector reads it with secretKeyRef; the token
      # value is never committed here.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DASH0_TOKEN/versions/latest"
        path: "DASH0_TOKEN"
      # DocuSign identity and verification material: the JWT triple
      # (INTEGRATION_KEY + USER_ID + PRIVATE_KEY), its endpoints, and the two
      # Connect webhook inputs.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_BASE_URL/versions/latest"
        path: "DOCUSIGN_BASE_URL"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_ACCOUNT_ID/versions/latest"
        path: "DOCUSIGN_ACCOUNT_ID"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_INTEGRATION_KEY/versions/latest"
        path: "DOCUSIGN_INTEGRATION_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_USER_ID/versions/latest"
        path: "DOCUSIGN_USER_ID"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_PRIVATE_KEY/versions/latest"
        path: "DOCUSIGN_PRIVATE_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_OAUTH_BASE/versions/latest"
        path: "DOCUSIGN_OAUTH_BASE"
      # Not a boot invariant, and `portal::signature` defaults it to a
      # retired-brand address when unset — so losing it degrades silently
      # rather than failing. It rides the Secret rail for that reason.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_SIGNER_EMAIL/versions/latest"
        path: "DOCUSIGN_SIGNER_EMAIL"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_HMAC_KEY/versions/latest"
        path: "DOCUSIGN_HMAC_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_WEBHOOK_SECRET/versions/latest"
        path: "DOCUSIGN_WEBHOOK_SECRET"
