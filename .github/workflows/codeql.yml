name: CodeQL

# CodeQL security code scanning, owned in-repo as a regular Actions workflow
# (advanced setup) rather than GitHub's managed "Code Quality" default setup.
# Owning the workflow is what lets us scan Rust — the managed setup only offers
# JavaScript/TypeScript — and pin the trigger.
#
# Runs ONLY on pull requests targeting `main`, never on push to `main`. This
# mirrors the repo's CI philosophy (see ci.yml): `main` advances solely through
# PRs, so the pre-merge run is the single gate and there is no post-merge scan.
#
# The managed "Code Quality analysis" toggle (Settings -> Security and quality)
# must be turned OFF once this lands, or both configurations scan in parallel.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# One in-flight run per PR; a new push cancels the superseded scan.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # `actions: read` lets the analyze step read this workflow run's metadata
  # (GET /actions/runs/:id) while combining and uploading SARIF; without it the
  # explicit block defaults that scope to `none` and the upload 403s.
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both languages scan with build-mode `none` (no compilation): JS/TS
          # is interpreted, and CodeQL's Rust support scans source without a
          # cargo build (GA since Oct 2025).
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:${{ matrix.language }}
