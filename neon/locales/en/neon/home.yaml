head_title: "{site_name} | Home"
meta_description: >-
  Tell Neon Law what legal help you need. Choose a Business or Personal plan,
  ask about an individual service, or start a free consultation for a dispute.
heading: "{shared:home.need_prompt}"
lead: >-
  Tell us whether you need help with a contract, your business, your family,
  or a dispute. If you are not sure where to start, contact us and we will help
  you find the next step.
contact_label: Contact us
hero:
  alt: New York City skyline at sunset, viewed from above Lower Manhattan.
  asset: img/new-york/new-york.png
service:
  heading: "{shared:home.mission_heading}"
  body:
    - - text: "{shared:home.mission_north_star} {shared:home.mission_promise}"
    - - text: "Choose the "
      - text: Business plan
        href: /fractional-gc
      - text: " for ongoing help with your company, or the "
      - text: Personal plan
        href: /personal-plan
      - text: " for help with taxes and personal information."
    - - text: "Need one thing? See our "
      - text: individual services
        href: /services
      - text: >-
          . Forms are free with a plan or $50 each otherwise; other legal work
          and government fees may cost extra.
    - - text: "If you have a dispute, start with a "
      - text: free consultation
        href: /litigation
      - text: ". You do not need a subscription for that first conversation."
practices_heading: Choose the help that fits.
practices:
  - mark: handshake
    heading: Business plan
    body: >-
      Ongoing legal help for your business: contracts, hiring, company records,
      and paperwork.
    href: /fractional-gc
  - mark: technology
    heading: Personal plan
    body: >-
      Help with taxes and personal information, including optional credit
      monitoring.
    href: /personal-plan
  - mark: gavel
    heading: Individual services
    body: >-
      Ask about a single form, filing, contract review, or other legal service.
    href: /services
  - mark: scales
    heading: Disputes
    body: >-
      Tell us what happened and what you need in a free consultation.
    href: /litigation
