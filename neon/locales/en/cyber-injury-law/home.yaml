head_title: "{site_name} | More in your pocket"
meta_description: >-
  Personal injury, re-engineered. A 20% attorney fee plus case expenses,
  data-driven discovery, and a free preliminary case assessment.
heading: We use AI to put more money in your pocket
lead: >-
  After an injury, you need every advantage. Serious legal firepower.
  Less overhead. A bigger share of what’s yours.
contact_label: Get my free case assessment
cyber_injury:
  eyebrow: Your recovery deserves an upgrade
  hero_lines: [WE USE AI TO, PUT MORE, MONEY IN, YOUR POCKET.]
  hero_note: Our mission, not a promise of recovery. Every case is different.
  fee_heading: [YOUR INJURY., YOUR FIGHT., MORE OF YOUR MONEY.]
  fee_body: >-
    Our attorney fee is 20% + case expenses. Compare that with a 33% fee
    and see what the difference could mean for you.
  fee_note: >-
    An illustrative comparison, not a settlement estimate. Fee arrangements
    vary; 33% is a rounded comparison benchmark, not a universal industry rate.
  calculation_note: >-
    Both fees are calculated after the same case expenses are deducted.
    “Your share” is before medical liens, reimbursements, taxes, or other
    deductions. Actual fees and responsibility for expenses are governed
    by a signed agreement. Special rules may apply.
  discovery_heading: [LESS PAPERWORK., MORE FIREPOWER.]
  discovery_body: >-
    Discovery is the work of gathering and reviewing evidence. Data engineering
    makes that work more efficient, so the focus stays on building your case.
  discovery_cards:
    - - TURN THE PILE INTO A PICTURE.
      - >-
        Organize medical records, bills, and incident reports into searchable
        data. Remove duplicate files so the same evidence doesn’t get reviewed twice.
      - LESS REPETITIVE WORK
    - - FIND THE SIGNAL. BUILD THE STORY.
      - >-
        Use AI-assisted extraction to connect dates, treatment, and expenses
        in an evidence timeline. Lawyers check the sources and investigate the gaps.
      - FASTER EVIDENCE REVIEW
    - - HUMAN JUDGMENT. MACHINE SUPPORT.
      - >-
        Automate sorting and routine document preparation. Keep strategy,
        accuracy, privilege decisions, and negotiation in a lawyer’s hands.
      - FOCUSED LEGAL EFFORT
  discovery_note: >-
    Our approach is designed to reduce discovery effort and cost.
    Savings depend on the records and demands of each case.
  assessment_heading: [HURT?, LET’S TALK, ABOUT IT.]
  assessment_body: >-
    Get an instant preliminary case assessment. Then take the next step
    with a free consultation.
  assessment_note: >-
    This automated checklist gives general information, not legal advice or an
    AI valuation. It does not accept your case or create an attorney-client
    relationship. Deadlines may apply. Your answers stay in this browser tab.
  recent_result: >-
    A consultation can help you understand whether someone else may be legally
    responsible and what evidence matters. This checklist cannot determine
    whether you have a valid claim.
  deadline_result: >-
    A lawyer should check the dates and any filing or notice requirements
    promptly. This checklist cannot tell you whether time remains to bring a claim.
  evidence_tips:
    - Keep incident reports, photos, insurance letters, and witness details.
    - Preserve photos of the location, incident reports, and witness details.
    - Tell the lawyer the injury happened at work; different claim processes may apply.
    - Prepare a short timeline of what happened and save any related records.
  medical_tips:
    - Keep treatment records, medical bills, and a note of work you missed.
    - If you need medical care, seek it promptly. Your health comes first.
  deadline_tip: >-
    Ask a licensed lawyer to review deadlines promptly, especially if a
    government entity may be involved.
  result_note: >-
    Only a lawyer reviewing the facts can assess fault, deadlines,
    eligibility, or case value.
  closing_lines: [THE FUTURE, FIGHTS FOR YOU.]
  footer_note: >-
    20% attorney fee plus case expenses, subject to a signed engagement
    agreement and applicable law. No outcome is guaranteed. AI-enhanced
    campaign portrait. Fee examples are illustrative.
