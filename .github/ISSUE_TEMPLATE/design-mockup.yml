name: Design mockup
description: Propose a screen as a rendered mockup plus reference HTML/CSS/JS. Engineers translate it to Dioxus.
title: "design: "
body:
  - type: markdown
    attributes:
      value: |
        **What this form is for.** You prototyped a screen outside this repository — plain HTML, CSS, and
        simple JavaScript — and you want it built. This issue carries the specification. Rust engineers
        translate an accepted mockup into Dioxus.

        **Nothing you attach here is merged, served, or vendored.** Your HTML/CSS/JS is reference material
        that shows intent; the shipped implementation is Rust. See
        [`docs/design-mockups.md`](https://github.com/neon-law-source-code/navigator/blob/main/docs/design-mockups.md).

  - type: textarea
    id: mockup-image
    attributes:
      label: The mockup, rendered
      description: >-
        Required. Drag a GIF of the interaction into this box (or a still PNG/JPG if the surface is
        genuinely static) and GitHub will upload it and leave a `![…](…)` line behind. An issue filed with
        no image will be closed — the picture is the specification, and nobody can translate prose alone.
      placeholder: Drag the GIF or still here. The uploaded markdown link should appear in this box.
    validations:
      required: true

  - type: textarea
    id: what-it-does
    attributes:
      label: What the screen does
      description: >-
        The job this screen performs for the person using it, and what the GIF is showing step by step.
        Name the states worth building: empty, loading, error, and success.
    validations:
      required: true

  - type: input
    id: target-surface
    attributes:
      label: Target surface
      description: >-
        The page or route this replaces or adds — an `/app/…` route for an authenticated screen, or the
        public path for a marketing page. Write "new" plus your proposed path if it does not exist yet.
      placeholder: /app/portal/projects/{id}
    validations:
      required: true

  - type: dropdown
    id: brands
    attributes:
      label: Brands this applies to
      description: >-
        Navigator serves two properties from two brand binaries. Select every brand this screen
        should appear on.
      multiple: true
      options:
        - neon — the public site
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who sees it
      description: >-
        The authorization tier. This decides which lens the translator builds and which tests it needs.
      options:
        - Anonymous — a public page, no sign-in
        - Client — someone the firm serves, signed in
        - Lawyer — an attorney or clerk
        - Admin
    validations:
      required: true

  - type: textarea
    id: data-read
    attributes:
      label: Data the screen reads
      description: >-
        Every value the mockup displays, in plain words — "the matter's name, its open date, and the list of
        documents with filename and upload date". The translator checks this against the existing read API
        instead of inventing an endpoint, so be specific about what has to be on screen at once.
    validations:
      required: true

  - type: textarea
    id: data-write
    attributes:
      label: Data the screen writes
      description: >-
        Every change the user can make from this screen, and what should happen after each one — what the
        form submits, what is created or updated, where the user lands. Write "none, read-only" if the
        screen only displays.
    validations:
      required: true

  - type: textarea
    id: reference-source
    attributes:
      label: Reference HTML / CSS / JS
      description: >-
        Required. Paste the source, or link a gist or repository holding it. This is **reference material,
        never code to merge**: no file from it is committed, bundled, vendored, or served. It exists so the
        translator can read your exact spacing, ordering, states, and interaction timing rather than guess
        at them from the image.
      render: html
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Anything the translation must preserve
      description: >-
        Optional. The details that would make you say "that is not the design I filed" — a specific
        ordering, a keyboard interaction, wording, a deliberate omission.
    validations:
      required: false

  - type: checkboxes
    id: attestations
    attributes:
      label: Required attestations
      description: >-
        This repository ships no client data. Everything on screen in your mockup — names, addresses, email
        addresses, matter titles, document contents — must be invented or firm-owned, and every non-firm
        email address must use a reserved example domain (`example.com`, `example.org`, `example.net`). Real
        phone numbers do not ship at all. A mockup carrying real client information will be closed and its
        attachments deleted.
      options:
        - label: >-
            Every name, address, email address, and document in this mockup is synthetic or firm-owned. No
            client information appears in the image, the source, or this issue.
          required: true
        - label: >-
            I understand the attached HTML/CSS/JS is reference material only and no part of it will be
            merged into this repository.
          required: true
