# Replace the base manifest's env list wholesale with the prod
# shape. Strategic merge with `$patch: replace` clobbers the base's
# list rather than merging by name — necessary because three of the
# base's entries (`OTEL_EXPORTER_OTLP_ENDPOINT`,
# `OAUTH_CLIENT_SECRET`, `SESSION_SECRET`) reference Secret objects
# that don't exist in prod or have values that crash
# the binary (empty-string OTLP URL).
#
# Secrets (NAVIGATOR_SURREAL_PASSWORD, SESSION_SECRET, OAUTH_CLIENT_SECRET,
# OAUTH_MICROSOFT_CLIENT_SECRET, RESTATE_BROKER_URL, RESTATE_AUTH_TOKEN,
# SENDGRID_API_KEY, DOCUSIGN_ACCESS_TOKEN, DOCUSIGN_HMAC_KEY — the last
# required by the `enforce_deployment_invariants` boot check —
# XERO_TENANT_ID + XERO_CLIENT_ID + XERO_CLIENT_SECRET for the Xero billing
# custom connection, and SENDGRID_FROM_EMAIL) come in via `envFrom` from the
# `navigator-web-secrets` Kubernetes Secret. That Secret is
# currently maintained out-of-band via `kubectl create secret
# generic`; syncing it from Secret Manager is a deferred follow-up.
# The same Secret is also
# `envFrom`'d by the `workflows-service` Deployment so the
# `email_send__welcome` worker handler picks up SendGrid without
# a parallel secret to maintain.
#
# `RESTATE_BROKER_URL` is the Restate Cloud tenant ingress URL.
# Pull it from the CLI's stored config rather than the web console,
# so the value doesn't leak through shell history:
#
#   restate -y cloud login
#   restate -y cloud env config --env navigator-prod
#   restate -y cloud env describe --env navigator-prod
#   # Add the broker + admin token to the K8s Secret:
#   kubectl -n navigator create secret generic navigator-web-secrets \
#       --from-literal=RESTATE_BROKER_URL=https://<id>.restate.cloud \
#       --from-literal=RESTATE_AUTH_TOKEN=<token> \
#       --dry-run=client -o yaml | kubectl apply -f -
#
# `OAUTH_CLIENT_ID` is committed in clear — OAuth client IDs are
# public identifiers (they appear in browser-visible authorize URLs
# anyway). Only the *secret* is in the K8s Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navigator-web
  namespace: navigator
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - $patch: replace
            - name: PORT
              value: "3001"
            # Derived from the public-host coordinate so canonical redirects,
            # robots.txt, and sitemap.xml all describe this deployment's own
            # origin. `/health` stays exempt because probes address backends.
            - name: CANONICAL_HOST
              value: NAVIGATOR_PUBLIC_HOST
            - name: NAVIGATOR_EMAIL_BACKEND
              value: sendgrid
            - name: RESTATE_IDENTITY_KEY
              # Public key used to verify Restate Cloud request signatures.
              # `ops ship` renders it from the deployment config.
              value: YOUR_RESTATE_IDENTITY_KEY
            - name: NAVIGATOR_CLAMD_ADDR
              value: clamav.navigator.svc.cluster.local:3310
            - name: NAVIGATOR_BOOTSTRAP_COMPANY
              value: Shook Law PLLC
            # The one identity that may sign in without a pre-seeded Person
            # row: `portal::oauth` JIT-creates it as `owner` on first login,
            # and every other IdP-authenticated email with no row gets 403.
            # Without it a freshly provisioned deployment has no way in at
            # all — nobody can seed the first Person because seeding requires
            # an authenticated Owner.
            #
            # A literal rather than a per-deployment coordinate, exactly like
            # NAVIGATOR_BOOTSTRAP_COMPANY above: both rows are the same
            # firm with the same GOOGLE_OAUTH_REQUIRED_HD (`neonlaw.com`), so
            # they share one Owner. The domain gate still applies — this
            # carve-out cannot admit an address the IdP would not issue.
            - name: NAVIGATOR_BOOTSTRAP_OWNER_EMAIL
              value: nick@neonlaw.com
            # Whether this deployment's matters are simulated rather than
            # real. `false` for every deployment that does not say otherwise,
            # including production — `ops ship` renders that default when the
            # deployment's `config.toml` omits the key, so a row holding real
            # client files cannot grow invented ones by accident.
            #
            # The persistent staging deployment sets it to `true` in its own
            # `config.toml`. It has to: its runtime profile is `production`
            # deliberately, so the profile alone cannot tell the two apart,
            # and without this it would serve an empty portfolio with no
            # banner. See docs/environments.md.
            - name: NAVIGATOR_SIMULATED_MATTERS
              value: "YOUR_SIMULATED_MATTERS"
            - name: NAVIGATOR_STORAGE_BACKEND
              value: gcs
            # The Chatwoot inbox the public pages open a support conversation
            # against. Optional, and empty means no widget at all — which is
            # what keeps the firm's live inbox off the staging release ring,
            # whose visitors are reading a synthetic portfolio. `ops ship`
            # renders the empty default when the deployment's `config.toml`
            # omits the key.
            #
            # Committed in clear like OAUTH_CLIENT_ID below: a Chatwoot website
            # token is a public identifier that appears in the HTML every
            # visitor's browser receives, so it rides inline env rather than the
            # projected Secret. NAVIGATOR_CHATWOOT_BASE_URL is deliberately
            # omitted — unset means Chatwoot Cloud, the installation the firm
            # uses; set it only for a self-hosted one.
            - name: NAVIGATOR_CHATWOOT_WEBSITE_TOKEN
              value: "YOUR_CHATWOOT_WEBSITE_TOKEN"
            # NAVIGATOR_STORAGE_ENDPOINT is deliberately omitted in prod:
            # it is a local/test override that the KIND base may set, and
            # the `$patch: replace` above drops the base's whole env list.
            # Do NOT add it back with `value: ""` — an empty string is a
            # *present* endpoint to `cloud::GcsStorageConfig`, which then
            # takes the emulator branch and every real-GCS request fails to
            # build a URL. Leave it unset so the backend talks to GCS.
            # Private documents bucket — client `blobs/<sha>` land here,
            # NOT in the public `-assets` bucket. Resolved by
            # `cloud::GcsStorageConfig` ahead of NAVIGATOR_STORAGE_BUCKET.
            - name: NAVIGATOR_DOCUMENTS_BUCKET
              value: YOUR_DOCUMENTS_BUCKET
            # The private per-Project client-portal bundle bucket. Each
            # Project's published `dist/` is streamed same-origin from here
            # through `/app/projects/{code}/portal/`, keeping the session and
            # participation gate on every request. An inline coordinate like
            # the buckets around it, and required by
            # `store::deployment::WEB_REQUIREMENTS`, so `ops ship` refuses to
            # roll a rendered web env that omits it.
            - name: NAVIGATOR_APPLICATIONS_BUCKET
              value: YOUR_APPLICATIONS_BUCKET
            # Public assets bucket — blank government forms are pulled
            # from here at fill/download time and verified against the
            # repo's `.sha256` pins (`cloud::assets_from_env`). Vendored
            # by `navigator forms sync`.
            - name: NAVIGATOR_ASSETS_BUCKET
              value: YOUR_ASSETS_BUCKET
            # Public origin `web` resolves blog/marketing image and webfont
            # URLs against — normally `https://<host>/assets`, the
            # same-origin proxy backed by the private assets bucket above
            # through this pod's workload identity. `server/public/img/` is
            # gitignored and never baked into the image, so leaving this
            # unset makes `views::assets::asset_url` fall back to `/public`
            # and every hero 404s even though the bucket is healthy.
            # `require_asset_base_url` refuses to ship without the
            # coordinate; this line is what carries it into the pod.
            - name: NAVIGATOR_ASSET_BASE_URL
              value: YOUR_ASSET_BASE_URL
            - name: OTEL_SERVICE_NAME
              value: navigator-web
            # OTEL_EXPORTER_OTLP_ENDPOINT is NOT declared inline: it comes in
            # via `envFrom` the shared `navigator-otel-env` ConfigMap below
            # (one source of truth for the collector URL). The base manifest's
            # KIND endpoint was dropped by the `$patch: replace` above; the
            # ConfigMap re-supplies the prod collector Service URL. Logs/traces/
            # metrics flow through the fail-closed redaction collector.
            - name: OAUTH_ISSUER_URL
              value: https://accounts.google.com
            - name: OAUTH_CLIENT_ID
              value: YOUR_OAUTH_CLIENT_ID_BROWSER
            - name: OAUTH_REDIRECT_URI
              value: https://NAVIGATOR_PUBLIC_HOST/auth/callback
            # Sign in with Microsoft, a second provider next to Google. Blank
            # in both is the off state: `portal::oauth::Provider::microsoft_from_env`
            # reads an empty OAUTH_MICROSOFT_CLIENT_ID as "no second provider"
            # and the button never renders, so a deployment that has not yet
            # registered an Entra app stays byte-identical. The matching
            # OAUTH_MICROSOFT_CLIENT_SECRET is key material and comes in via
            # `envFrom` above, alongside OAUTH_CLIENT_SECRET, not inline here.
            # No OAUTH_MICROSOFT_ISSUER_URL: leaving it unset selects the
            # multi-tenant `/organizations` authority, which is what makes
            # `IdTokenVerifier` select `IssuerPolicy::EntraTenants` instead of
            # a plain issuer byte compare.
            - name: OAUTH_MICROSOFT_CLIENT_ID
              value: YOUR_OAUTH_MICROSOFT_CLIENT_ID
            - name: OAUTH_MICROSOFT_ALLOWED_TENANTS
              value: YOUR_OAUTH_MICROSOFT_ALLOWED_TENANTS
            # Base URL surfaced in the OpenAPI `servers` block at
            # /app/api/openapi.json. Must include scheme and stop at the host —
            # the document tacks `/app/api/*` paths onto this value.
            - name: NAV_BASE_URL
              value: https://NAVIGATOR_PUBLIC_HOST
            # Google OAuth access-token validator for /mcp.
            # `web::google_oauth` posts the bearer token to Google's
            # tokeninfo endpoint and accepts the request when the
            # token's `aud`/`azp` is in this allowlist, `email_verified`
            # is true, and the email ends with the required domain.
            # Both Workspace OAuth clients are listed so either
            # navigator-web's (browser SSO) or the Gemini Enterprise
            # data-store client is accepted. Add another client by
            # appending `,<id>.apps.googleusercontent.com`.
            - name: GOOGLE_OAUTH_CLIENT_IDS
              value: "YOUR_OAUTH_CLIENT_ID_GEMINI,YOUR_OAUTH_CLIENT_ID_BROWSER"
            - name: GOOGLE_OAUTH_REQUIRED_HD
              value: YOUR_GOOGLE_OAUTH_REQUIRED_HD
            # Enables the Vertex AI Gemini Flash router for free-form
            # `message/send` calls on /app/api/aida/rpc (Gemini Enterprise
            # sends user text without `metadata.skill`; the router
            # translates that to a tool call). Auth via Workload
            # Identity — the pod's GSA carries roles/aiplatform.user.
            # When this env is unset the binary falls back to
            # NullRouter and returns an enhanced-error Task.
            - name: NAVIGATOR_GCP_PROJECT_ID
              value: YOUR_PROJECT_ID
            - name: NAVIGATOR_GCP_LOCATION
              value: us-west4
            # `gemini-2.5-flash` is the unpinned current Flash build.
            # Probe before changing:
            #   curl -X POST -H "Authorization: Bearer $(gcloud auth \
            #     application-default print-access-token)" \
            #     "https://us-west4-aiplatform.googleapis.com/v1/projects/\
            #      YOUR_PROJECT_ID/locations/us-west4/publishers/google/\
            #      models/<MODEL>:generateContent" -d '{}'
            # 200 = available, 404 = model not in this region.
            - name: NAVIGATOR_ROUTER_MODEL
              value: gemini-2.5-flash
          envFrom:
            # Collector endpoint (OTEL_EXPORTER_OTLP_ENDPOINT) — shared with
            # workflows-service and the *-trigger CronJobs.
            - configMapRef:
                name: navigator-otel-env
            - secretRef:
                name: navigator-web-secrets
