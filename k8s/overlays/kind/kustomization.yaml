apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Full local KIND stack — base platform + in-cluster dependencies
# (SurrealDB, Rauthy, Garage, Restate Operator-managed
# RestateCluster), the workflows-service worker (hosting every
# workflow, including Archives) as a RestateDeployment CR, the
# nightly archives-trigger CronJob, and the navigator-web app itself.
#
# Apply: kubectl apply -k k8s/overlays/kind
#
# For host-side `web` development (skip the in-cluster web
# Deployment), use the sibling `kind-deps` overlay instead.

namespace: navigator

resources:
  - ../../staging
  - garage
  - rauthy
  # KIND-only, like garage: production runs Surreal Cloud, so this pod
  # never ships from `k8s/staging` (#1093).
  - surreal
  - staging-coordinates.yaml
  - archives-trigger
  - billing-canary-trigger
  - billing-digest-trigger
  - dri-digest-trigger
  - heartbeat-trigger

patches:
  - path: web-rauthy-loopback.yaml
  # The SurrealDB coordinates the in-cluster web pod needs to clear its
  # boot invariants (#1172). See web-surreal.yaml.
  - path: web-surreal.yaml
