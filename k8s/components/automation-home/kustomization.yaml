apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The automation-home component adds the heartbeat trigger to the one
# deployment whose workflows-service registers GitHub engineering automation.
# `ops ship` selects this component from the deployment's project coordinate;
# ordinary deployments render no CronJob for this service.

resources:
  - cron-github-automation-heartbeat-trigger.yaml
