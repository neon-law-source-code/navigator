# cargo-deny configuration for the navigator workspace.
#
# Runs from `.github/workflows/ci.yml` on every push and PR. Three
# checks are active:
#
# - `advisories` — fails the build on any open RUSTSEC advisory
#   against a crate in the dep tree.
# - `licenses`   — fails on any license not in the allowlist below.
# - `bans`       — empty for now; reserved for blocking a specific
#   crate version if a transitive dep turns out to drift on us.

[advisories]
version = 2
yanked   = "warn"
ignore   = []

[licenses]
version             = 2
confidence-threshold = 0.93
# Every license currently observed in the workspace dep tree, plus
# a few compatible siblings we'd accept if a new dep pulled one in.
# Re-validate this list when adding a substantial new dependency.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
exceptions = []
# The allowlist above is the policy for *third-party* dependencies, and it stays
# permissive on purpose. The workspace's own crates are `BUSL-1.1` (root
# `[workspace.package]`) and never belong in it: this list governs what the
# workspace is willing to *consume*, which is a different question from how the
# workspace is licensed out. A permissive inbound policy under a source-available
# outbound grant is the combination that works — every license above may be
# distributed inside this work, whereas the reverse would not hold. It has to
# keep holding at the Change Date too: each version converts to Apache-2.0
# four years on, so an inbound license that could not be distributed inside an
# Apache-2.0 work would break then rather than now.
# `publish = false` keeps the crates off crates.io, and `private.ignore` exempts
# them from this check.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards         = "deny"

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
