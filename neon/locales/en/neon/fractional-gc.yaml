head_title: "{site_name} | Business plan"
meta_description: >-
  Contract-library access and a counsel relationship for the work we agree to
  handle, for $10 a day.
eyebrow: "{shared:fractional_gc.eyebrow}"
heading:
  text: "{shared:fractional_gc.title}"
  accent_words: 1
lead: "{shared:fractional_gc.lede}"
cta_label: Ask about access
virtues:
  - word: Clear
    body: >-
      We show the access charge and agree the price of each Notation before
      work begins.
  - word: Practical
    body: >-
      Start with a template you can fill out, or ask us to prepare a scoped
      Notation.
  - word: Accountable
    body: >-
      A lawyer confirms the scope and the facts before the documents are
      prepared.
fee_heading: Access and work, priced separately
fee_body: >-
  The Business plan is $10 a day for contract-library access and the ability to
  name Neon Law as your counsel in work we agree to handle. Fill out an
  unchanged template and we can send it for signature for $5. When you need a
  document prepared or revised, we agree a fixed Notation fee before starting;
  Notations begin at $100.
pricing:
  - title: Business plan
    price: "{shared:fractional_gc.price}"
    cadence: /day
    blurb: >-
      $10 a day for contract-library access and a counsel relationship tied to
      work we agree to handle.
    features:
      - Contract-library access
      - Name Neon Law as your counsel in work we agree to handle
      - Send an unchanged template for signature at $5
      - Notations for prepared or revised documents start at $100
      - One agreed scope and price for each Notation
    day_rate_bill: 10
closing_heading: Ready to start a Notation?
closing_body: Ask whether the Business plan and your next Notation fit your work.
closing_email: "{firm_email}"
