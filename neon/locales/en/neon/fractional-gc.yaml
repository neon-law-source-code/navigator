virtues:
  - word: Clear
    body: >-
      We explain what is included, what costs extra, and what we need from you
      before work begins.
  - word: Practical
    body: >-
      Get help with the records, forms, contracts, and recurring paperwork that
      keep your business moving.
  - word: Responsive
