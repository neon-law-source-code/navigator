---
# Every postal identity Neon Law seeds, applied on every boot in every
# environment. These are real addresses we answer mail at, not fixtures.
#
# `lookup_fields` keys on the entity, so one entity's box can never overwrite
# another's — and that entity boundary is the one that actually matters for
# client mail.
#
# An entity carries as many rows as it keeps addresses —
# `find_or_create_for_entity` keys on entity, street, and ZIP together, so a
# further jurisdiction is a further record here and nothing else.
#
# Within a mail centre the box number is the whole address — every Ridgeview row
# shares a street, suite, and ZIP — so a wrong suffix misdelivers to another
# entity of ours rather than bouncing.
lookup_fields:
  - entity_id
  - street
  - zip
records:
  # Shook Law PLLC is the entity of record: the professional LLC that renders
  # the legal services, holds the copyright, and trades as Neon Law. Its box is
  # the letterhead address `views::brand::FIRM_OFFICES` publishes.
  - entity:
      name: Shook Law PLLC
      entity_type:
        name: Professional LLC
        jurisdiction:
          name: Nevada
    street: 5150 Mae Anne Ave Ste 405-9002
    city: Reno
    state: NV
    country: USA
    zip: "89523"
    is_verified: true
    mailroom:
      name: Ridgeview Mail Center
  - entity:
      name: shook.family
      entity_type:
        name: Family Trust
        jurisdiction:
          name: Nevada
    street: 5150 Mae Anne Ave Ste 405-9005
    city: Reno
    state: NV
    country: USA
    zip: "89523"
    is_verified: true
    mailroom:
      name: Ridgeview Mail Center
  - entity:
      name: Nicholas Shook
      entity_type:
        name: Human
        jurisdiction:
          name: Washington
    street: 5150 Mae Anne Ave Ste 405-9011
    city: Reno
    state: NV
    country: USA
    zip: "89523"
    is_verified: true
    mailroom:
      name: Ridgeview Mail Center
