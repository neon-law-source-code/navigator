name: project-gate

# Reusable gate for a Project repository. A Project's own `ci.yml` is a thin
# caller pinned to an exact release tag of this file:
#
#     jobs:
#       ci:
#         uses: neon-law-source-code/navigator/.github/workflows/project-gate.yml@YY.M.D
#         with:
#           project: "project-code"
#           host: "staging.neonlaw.com"
#
# The checkout's `navigator.yaml` supplies the pin. This workflow does not
# resolve `latest` and does not trust a caller-supplied version.
# `ops github setup` bumps the caller's pin; it never edits this file.
# Pull requests run the live read-only document and Project checks plus seed
# validation dry-runs. Main pushes additionally reconcile seeds and publish.

on:
  workflow_call:
    inputs:
      project:
        description: Project code declared by navigator.yaml.
        required: true
        type: string
      host:
        description: Deployment host for live Project verification and seed validation.
        required: false
        type: string
        default: ""

jobs:
  read-manifest:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      project: ${{ steps.manifest.outputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read and check navigator.yaml
        id: manifest
        env:
          EXPECTED_PROJECT: ${{ inputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          values="$(ruby -e 'require "yaml"; m = YAML.safe_load(File.read("navigator.yaml"), aliases: false) || {}; p = m["project"]; p = p["name"] if p.is_a?(Hash); abort("navigator.yaml is missing project.name") unless p.is_a?(String) && !p.strip.empty?; v = m["version"]; v = v.strip if v.is_a?(String); v = "" unless v.is_a?(String); puts "version=#{v}"; puts "project=#{p.strip}"')"
          version=""
          project=""
          while IFS='=' read -r key value; do
              case "${key}" in
                version) version="${value}" ;;
                project) project="${value}" ;;
              esac
          done <<< "${values}"
          if [ "${project}" != "${EXPECTED_PROJECT}" ]; then
              echo "::error::navigator.yaml project.name '${project}' does not match project input '${EXPECTED_PROJECT}'."
              exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::version must be an exact release tag, not '${version}'."
              exit 1
          fi
          {
              echo "version=${version}"
              echo "project=${project}"
          } >> "${GITHUB_OUTPUT}"

  # Installs, lints, typechecks, tests, and builds every application this
  # repository declares, then runs the one gate over the whole tree.
  verify:
    needs: read-manifest
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installed first: `applications --manifest` below needs the CLI, and
      # so does the origin gate at the end of this job.
      #
      # Self-referencing composite actions in this file are pinned to an
      # absolute tag, not to the ref the caller used, so they necessarily lag
      # by one release: bump this tag in the release that follows any change a
      # caller needs. ENG-671 introduced `.github/actions/navigator-install`
      # after 26.9.16, so 26.9.17-rc.1 is the first tag that carries it — while
      # this pin still read 26.9.16, every caller of project-gate.yml@26.9.17-rc.1
      # failed to resolve the action at all.
      - uses: neon-law-source-code/navigator/.github/actions/navigator-install@26.9.23-rc.1
        with:
          version: ${{ needs.read-manifest.outputs.version }}
      # Application discovery lives in the CLI (`cli/src/projects/repository.rs`)
      # now, not in this workflow. This prints the one manifest path
      # `pnpm/action-setup` reads its version pin from, or nothing when the
      # repository declares no application.
      - name: locate the application manifest
        id: application
        run: echo "manifest=$(navigator project applications --manifest)" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.application.outputs.manifest != ''
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.application.outputs.manifest != ''
        with:
          package_json_file: ${{ steps.application.outputs.manifest }}
      # Installs, lints, typechecks, tests, and builds every discovered
      # application, one at a time, stopping at the first failure. A
      # repository with none prints a notice and succeeds — the gate still
      # passes, it simply has nothing to build.
      - name: navigator project build
        run: navigator project build --dir .
      # One gate over the whole repository: content rules, YAML, seeds,
      # locales, layout, mount, and — because this is the job that ran the
      # builds — the origin pass (`Y009`) reading each `dist/`. `--ci` writes
      # nothing, so a file the gate would have fixed fails here rather than
      # being rewritten in a checkout about to be discarded, and it opens the
      # live-row door on main or a pull-request merge ref. The host is the
      # one `navigator.yaml` declares, so there is nothing to pass here.
      - name: navigator project gate
        run: navigator project gate --ci

  documents:
    needs: read-manifest
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # See the matching comment in the `verify` job: this pin lags until a
      # release publishes the action.
      - uses: neon-law-source-code/navigator/.github/actions/navigator-install@26.9.23-rc.1
        with:
          version: ${{ needs.read-manifest.outputs.version }}
      - name: navigator site document verify
        env:
          HOST: ${{ inputs.host }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "${HOST}" ] && { { [ "${EVENT_NAME}" = "push" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; } && [ "${REF}" = "refs/heads/main" ]; } || [ "${EVENT_NAME}" = "pull_request" ]; then
              navigator site document verify . --ci --host "${HOST}"
          else
              navigator site document verify .
          fi

  # Reconciles `seeds/` against the live deployment, or validates them against
  # the live Project with a server-enforced dry-run on a pull request. `navigator project gate`
  # already covers the offline shape of every `seeds/*.yaml` document (in
  # `verify`, above) on every event, including a pull request from a fork —
  # so this job still validates every seed document offline. The PR token is
  # scoped to dry-run seed validation only. Only a push or approved dispatch on
  # `main` exchanges the runner's OIDC token for live reconciliation. Never
  # `--overwrite`: the natural key makes a re-run a no-op, and a CI job that
  # can replace a client's recorded field unattended is not one the firm
  # wants. Its result is included in the required `ci` job so a failed live
  # check cannot surface only after merge.
  seeds:
    needs: read-manifest
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # See the matching comment in the `verify` job: this pin lags until a
      # release publishes the action.
      - uses: neon-law-source-code/navigator/.github/actions/navigator-install@26.9.23-rc.1
        with:
          version: ${{ needs.read-manifest.outputs.version }}
      - name: navigator site import
        env:
          HOST: ${{ inputs.host }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ ! -d seeds ]; then
              echo "no seeds — nothing to reconcile"
              exit 0
          fi
          if [ -z "${HOST}" ]; then
              echo "no host — seeds are checked offline"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
              navigator site import --dry-run --ci --host "${HOST}"
          elif { [ "${EVENT_NAME}" = "push" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; } && [ "${REF}" = "refs/heads/main" ]; then
              navigator site import --ci --host "${HOST}"
          else
              echo "seeds/*.yaml is checked offline by navigator project gate; live validation runs only on main or a pull-request merge ref"
          fi

  ci:
    needs: [read-manifest, verify, documents, seeds]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        run: |
          test "${{ needs.read-manifest.result }}" = "success"
          test "${{ needs.verify.result }}" = "success"
          test "${{ needs.documents.result }}" = "success"
          test "${{ needs.seeds.result }}" = "success"
