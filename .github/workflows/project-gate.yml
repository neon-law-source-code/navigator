name: project-gate

# Reusable gate for a Project repository. A Project's own `ci.yml` is a thin
# caller pinned to an exact release tag of this file:
#
#     jobs:
#       ci:
#         uses: neon-law-source-code/navigator/.github/workflows/project-gate.yml@YY.M.D
#         with:
#           project: "project-code"
#           host: "staging.neonlaw.com"
#
# The checkout's `navigator.yaml` supplies the pin. This workflow does not
# resolve `latest` and does not trust a caller-supplied version.
# `ops github setup` bumps the caller's pin; it never edits this file.
# Pull requests run the offline checks. Live verification belongs to `cd.yml`.

on:
  workflow_call:
    inputs:
      project:
        description: Project code declared by navigator.yaml.
        required: true
        type: string
      host:
        description: Deployment host for live document verification on push to main.
        required: false
        type: string
        default: ""

jobs:
  read-manifest:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      project: ${{ steps.manifest.outputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read and check navigator.yaml
        id: manifest
        env:
          EXPECTED_PROJECT: ${{ inputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          values="$(ruby -e 'require "yaml"; m = YAML.safe_load(File.read("navigator.yaml"), aliases: false) || {}; p = m["project"]; p = p["name"] if p.is_a?(Hash); abort("navigator.yaml is missing project.name") unless p.is_a?(String) && !p.strip.empty?; v = m["version"]; v = v.strip if v.is_a?(String); v = "" unless v.is_a?(String); puts "version=#{v}"; puts "project=#{p.strip}"')"
          version=""
          project=""
          while IFS='=' read -r key value; do
              case "${key}" in
                version) version="${value}" ;;
                project) project="${value}" ;;
              esac
          done <<< "${values}"
          if [ "${project}" != "${EXPECTED_PROJECT}" ]; then
              echo "::error::navigator.yaml project.name '${project}' does not match project input '${EXPECTED_PROJECT}'."
              exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::version must be an exact release tag, not '${version}'."
              exit 1
          fi
          {
              echo "version=${version}"
              echo "project=${project}"
          } >> "${GITHUB_OUTPUT}"

  lint:
    needs: read-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        with:
          node-version: "22"
      - name: Locate the pnpm manifest
        id: pnpm-manifest
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # `package_json_file` takes one concrete path, so name the manifest pnpm
          # reads `packageManager` from. The order mirrors `application_workspaces`
          # in cli/src/projects/repository.rs: the legacy `portal/`, then
          # `apps/portal/`, then any other declared application, then a root Vite
          # workspace. Hard-coding one of those breaks the other layouts.
          candidates=(portal/package.json apps/portal/package.json)
          candidates+=(apps/*/package.json)
          candidates+=(package.json)
          for candidate in "${candidates[@]}"; do
              if [ -f "${candidate}" ]; then
                  echo "Using ${candidate}"
                  echo "manifest=${candidate}" >> "${GITHUB_OUTPUT}"
                  exit 0
              fi
          done
          echo "::error::the application guard matched but no package.json was found."
          exit 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        with:
          package_json_file: ${{ steps.pnpm-manifest.outputs.manifest }}
      - name: Install application dependencies
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_manifests=(apps/*/package.json)
          if [ -f portal/package.json ]; then
              package_manifests+=(portal/package.json)
          fi
          if [ -f package.json ] && { [ -f vite.config.ts ] || [ -f vite.config.js ]; }; then
              if [ ! -f portal/package.json ] && [ ! -f apps/portal/package.json ]; then
                  package_manifests+=(package.json)
              fi
          fi
          for package_json in "${package_manifests[@]}"; do
              app_dir="${package_json%/package.json}"
              pnpm --dir "${app_dir}" install --frozen-lockfile
          done
      - name: Lint applications
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_manifests=(apps/*/package.json)
          if [ -f portal/package.json ]; then
              package_manifests+=(portal/package.json)
          fi
          if [ -f package.json ] && { [ -f vite.config.ts ] || [ -f vite.config.js ]; }; then
              if [ ! -f portal/package.json ] && [ ! -f apps/portal/package.json ]; then
                  package_manifests+=(package.json)
              fi
          fi
          for package_json in "${package_manifests[@]}"; do
              app_dir="${package_json%/package.json}"
              pnpm --dir "${app_dir}" lint
          done

  verify:
    needs: read-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        with:
          node-version: "22"
      - name: Locate the pnpm manifest
        id: pnpm-manifest
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # `package_json_file` takes one concrete path, so name the manifest pnpm
          # reads `packageManager` from. The order mirrors `application_workspaces`
          # in cli/src/projects/repository.rs: the legacy `portal/`, then
          # `apps/portal/`, then any other declared application, then a root Vite
          # workspace. Hard-coding one of those breaks the other layouts.
          candidates=(portal/package.json apps/portal/package.json)
          candidates+=(apps/*/package.json)
          candidates+=(package.json)
          for candidate in "${candidates[@]}"; do
              if [ -f "${candidate}" ]; then
                  echo "Using ${candidate}"
                  echo "manifest=${candidate}" >> "${GITHUB_OUTPUT}"
                  exit 0
              fi
          done
          echo "::error::the application guard matched but no package.json was found."
          exit 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        with:
          package_json_file: ${{ steps.pnpm-manifest.outputs.manifest }}
      - name: Install application dependencies
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_manifests=(apps/*/package.json)
          if [ -f portal/package.json ]; then
              package_manifests+=(portal/package.json)
          fi
          if [ -f package.json ] && { [ -f vite.config.ts ] || [ -f vite.config.js ]; }; then
              if [ ! -f portal/package.json ] && [ ! -f apps/portal/package.json ]; then
                  package_manifests+=(package.json)
              fi
          fi
          for package_json in "${package_manifests[@]}"; do
              app_dir="${package_json%/package.json}"
              pnpm --dir "${app_dir}" install --frozen-lockfile
          done
      - name: Typecheck applications
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_manifests=(apps/*/package.json)
          if [ -f portal/package.json ]; then
              package_manifests+=(portal/package.json)
          fi
          if [ -f package.json ] && { [ -f vite.config.ts ] || [ -f vite.config.js ]; }; then
              if [ ! -f portal/package.json ] && [ ! -f apps/portal/package.json ]; then
                  package_manifests+=(package.json)
              fi
          fi
          for package_json in "${package_manifests[@]}"; do
              app_dir="${package_json%/package.json}"
              pnpm --dir "${app_dir}" typecheck
          done
      - name: Test applications
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_manifests=(apps/*/package.json)
          if [ -f portal/package.json ]; then
              package_manifests+=(portal/package.json)
          fi
          if [ -f package.json ] && { [ -f vite.config.ts ] || [ -f vite.config.js ]; }; then
              if [ ! -f portal/package.json ] && [ ! -f apps/portal/package.json ]; then
                  package_manifests+=(package.json)
              fi
          fi
          for package_json in "${package_manifests[@]}"; do
              app_dir="${package_json%/package.json}"
              pnpm --dir "${app_dir}" test
          done
      - name: Build applications
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_manifests=(apps/*/package.json)
          if [ -f portal/package.json ]; then
              package_manifests+=(portal/package.json)
          fi
          if [ -f package.json ] && { [ -f vite.config.ts ] || [ -f vite.config.js ]; }; then
              if [ ! -f portal/package.json ] && [ ! -f apps/portal/package.json ]; then
                  package_manifests+=(package.json)
              fi
          fi
          for package_json in "${package_manifests[@]}"; do
              app_dir="${package_json%/package.json}"
              pnpm --dir "${app_dir}" build
          done
      # The origin gate (`Y009`) reads each application's built `dist/`, so it
      # can only run in the job that produced one. `notation` validates a bare
      # checkout on its own runner and never sees a build.
      - name: download and install the navigator CLI
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        env:
          VERSION: ${{ needs.read-manifest.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::version must be an exact release tag, not '${VERSION}'."
              exit 1
          fi
          asset="navigator-${VERSION}-linux.tar.gz"
          tmp="$(mktemp -d)"
          gh release download "${VERSION}" \
            --repo neon-law-source-code/navigator \
            --pattern "${asset}" \
            --dir "${tmp}" \
            --clobber
          tar -xzf "${tmp}/${asset}" -C "${tmp}" navigator
          install -d "${RUNNER_TEMP}/navigator-bin"
          install -m 0755 "${tmp}/navigator" "${RUNNER_TEMP}/navigator-bin/navigator"
          echo "${RUNNER_TEMP}/navigator-bin" >> "${GITHUB_PATH}"
      - name: navigator validate --ci
        if: hashFiles('apps/*/package.json', 'portal/package.json', 'vite.config.ts', 'vite.config.js') != ''
        run: navigator validate . --ci

  notation:
    needs: read-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download and install the navigator CLI
        env:
          VERSION: ${{ needs.read-manifest.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::version must be an exact release tag, not '${VERSION}'."
              exit 1
          fi
          asset="navigator-${VERSION}-linux.tar.gz"
          tmp="$(mktemp -d)"
          gh release download "${VERSION}" \
            --repo neon-law-source-code/navigator \
            --pattern "${asset}" \
            --dir "${tmp}" \
            --clobber
          tar -xzf "${tmp}/${asset}" -C "${tmp}" navigator
          install -d "${RUNNER_TEMP}/navigator-bin"
          install -m 0755 "${tmp}/navigator" "${RUNNER_TEMP}/navigator-bin/navigator"
          echo "${RUNNER_TEMP}/navigator-bin" >> "${GITHUB_PATH}"
      - name: navigator validate
        run: navigator validate .

  documents:
    needs: read-manifest
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download and install the navigator CLI
        env:
          VERSION: ${{ needs.read-manifest.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::version must be an exact release tag, not '${VERSION}'."
              exit 1
          fi
          asset="navigator-${VERSION}-linux.tar.gz"
          tmp="$(mktemp -d)"
          gh release download "${VERSION}" \
            --repo neon-law-source-code/navigator \
            --pattern "${asset}" \
            --dir "${tmp}" \
            --clobber
          tar -xzf "${tmp}/${asset}" -C "${tmp}" navigator
          install -d "${RUNNER_TEMP}/navigator-bin"
          install -m 0755 "${tmp}/navigator" "${RUNNER_TEMP}/navigator-bin/navigator"
          echo "${RUNNER_TEMP}/navigator-bin" >> "${GITHUB_PATH}"
      - name: navigator site document verify
        env:
          HOST: ${{ inputs.host }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ ! -d documents ]; then
              echo "no documents — nothing to verify"
              exit 0
          fi
          if [ -n "${HOST}" ] && [ "${EVENT_NAME}" = "push" ] && [ "${REF}" = "refs/heads/main" ]; then
              navigator site document verify . --ci --host "${HOST}"
          else
              navigator site document verify .
          fi

  manifest:
    needs: read-manifest
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download and install the navigator CLI
        env:
          VERSION: ${{ needs.read-manifest.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::version must be an exact release tag, not '${VERSION}'."
              exit 1
          fi
          asset="navigator-${VERSION}-linux.tar.gz"
          tmp="$(mktemp -d)"
          gh release download "${VERSION}" \
            --repo neon-law-source-code/navigator \
            --pattern "${asset}" \
            --dir "${tmp}" \
            --clobber
          tar -xzf "${tmp}/${asset}" -C "${tmp}" navigator
          install -d "${RUNNER_TEMP}/navigator-bin"
          install -m 0755 "${tmp}/navigator" "${RUNNER_TEMP}/navigator-bin/navigator"
          echo "${RUNNER_TEMP}/navigator-bin" >> "${GITHUB_PATH}"
      - name: live status
        env:
          HOST: ${{ inputs.host }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "${HOST}" ] && [ "${EVENT_NAME}" = "push" ] && [ "${REF}" = "refs/heads/main" ]; then
              navigator site projects gate --ci --host "${HOST}"
          else
              navigator site projects gate
          fi

  # Reconciles `seeds/` against the live deployment. `navigator validate`
  # already covers the offline shape of every `seeds/*.yaml` document (in
  # `notation`, above) on every event, including a pull request from a fork —
  # so this job mints nothing there. A PR branch cannot mint a scoped token in
  # any case (`POST /auth/ci/seed-token` only honors `refs/heads/main`), which
  # is exactly the hole a token mintable from a fork would open. Only a push
  # to `main` exchanges the runner's OIDC token and reconciles. Never
  # `--overwrite`: the natural key makes a re-run a no-op, and a CI job that
  # can replace a client's recorded field unattended is not one the firm
  # wants. Deliberately outside the `ci` job's `needs:` — its live half needs
  # a reachable deployment, and the always-required check must never depend
  # on that.
  seeds:
    needs: read-manifest
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download and install the navigator CLI
        env:
          VERSION: ${{ needs.read-manifest.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::version must be an exact release tag, not '${VERSION}'."
              exit 1
          fi
          asset="navigator-${VERSION}-linux.tar.gz"
          tmp="$(mktemp -d)"
          gh release download "${VERSION}" \
            --repo neon-law-source-code/navigator \
            --pattern "${asset}" \
            --dir "${tmp}" \
            --clobber
          tar -xzf "${tmp}/${asset}" -C "${tmp}" navigator
          install -d "${RUNNER_TEMP}/navigator-bin"
          install -m 0755 "${tmp}/navigator" "${RUNNER_TEMP}/navigator-bin/navigator"
          echo "${RUNNER_TEMP}/navigator-bin" >> "${GITHUB_PATH}"
      - name: navigator site import
        env:
          HOST: ${{ inputs.host }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ ! -d seeds ]; then
              echo "no seeds — nothing to reconcile"
              exit 0
          fi
          if [ -n "${HOST}" ] && [ "${EVENT_NAME}" = "push" ] && [ "${REF}" = "refs/heads/main" ]; then
              navigator site import --ci --host "${HOST}" --dir seeds
          else
              echo "seeds/*.yaml is validated offline by navigator validate; reconciling against a live deployment happens on push to main"
          fi

  ci:
    needs: [read-manifest, lint, verify, notation, documents, manifest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        run: |
          test "${{ needs.read-manifest.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.verify.result }}" = "success"
          test "${{ needs.notation.result }}" = "success"
          test "${{ needs.documents.result }}" = "success"
          test "${{ needs.manifest.result }}" = "success"
