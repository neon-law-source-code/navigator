name: navigator validate
description: >-
  Lint a content repository's Markdown, event, and YAML files with the
  Neon Law Navigator CLI, using a published release binary.

# The one-line gate for repositories that hold content, but do not hold
# Navigator. `deploy.yml` already attaches `navigator-<TAG>-<platform>` archives
# to every immutable release (`YY.M.D`, legacy `YY.M.D.H`, or
# `YY.M.D-hotfix.N`); this action downloads the one that matches
# the runner and runs `navigator validate` over the checked-out tree.
#
# Consuming repository, in full:
#
#     - uses: actions/checkout@<sha>  # v7
#     - uses: neon-law-source-code/navigator/.github/actions/validate@YY.M.D
#       with:
#         version: "YY.M.D"
#
# ## One gate for a Project repository
#
# Set `project_repository: true` and this becomes the whole gate for a Project's
# one repository, holding both kinds of source. It runs
# `navigator site projects repository validate`, which covers whichever halves are
# present, and then verifies the built portal is mounted where Navigator will
# serve it.
#
# It carries no organization, host, or client name, because none of those vary:
# the repository name is the Project code and the mount is that name plus the
# literal `portal`, identically in every deployment. Only the *host* differs
# between deployments, and a host never appears in a Vite base.
#
# There is deliberately **no path filter**. Each half no-ops when this
# repository does not carry it, so the one job always runs — a required check
# that can be satisfied by being skipped is not a gate.
#
#     - run: pnpm --dir portal build
#     - uses: neon-law-source-code/navigator/.github/actions/validate@YY.M.D
#       with:
#         version: "YY.M.D"
#         project_repository: true
#
# `version` is required and must be an exact tag. That is the house rule from
# docs/gitops.md ("Pin every consumed image, binary, and action"): publishing
# `latest` is allowed, consuming it is not — a rolling pointer also round-trips
# a release API that has 500'd and killed a job.

inputs:
  version:
    description: >-
      Exact immutable release tag to download, shaped `YY.M.D` or
      `YY.M.D-hotfix.N`. Required and never `latest` — consumed binaries are
      pinned.
    required: true
  dir:
    description: Directory to validate, relative to the workspace.
    required: false
    default: "."
  token:
    description: >-
      Token used to download the release asset. The default `github.token` is
      enough when the Navigator repository is public or the caller lives in the
      same organization; a cross-organization private caller must pass a PAT
      with `contents: read` on Navigator.
    required: false
    default: ${{ github.token }}
  question_codes_from_store:
    description: >-
      Set to "true" to load the stored question registry so N104 rejects
      question codes outside it. The registry lives in SurrealDB, so the job
      must also set NAVIGATOR_SURREAL_ENDPOINT, NAVIGATOR_SURREAL_NAMESPACE,
      and NAVIGATOR_SURREAL_DATABASE. An unreachable store warns and falls
      back to the canonical codes; without this input that one check is
      skipped and everything else still runs.
    required: false
    default: "false"
  project_repository:
    description: >-
      Validate the checked-out directory as one Project's repository: enforce
      the source-only layout, lint its notation templates, hold its portal to
      the Vite contract, and verify the built portal is mounted where Navigator
      serves it.
    required: false
    default: "false"
  repository:
    description: >-
      Repository name, which *is* the Project code. Defaults to the current
      GitHub repository's name; pass this for a differently named local
      checkout. Nothing else declares the code, so nothing can disagree with it.
    required: false
    default: ${{ github.event.repository.name }}
  portal_dist:
    description: >-
      The portal's build output directory, relative to `portal/`. Verified only
      when a portal is present.
    required: false
    default: "dist"

runs:
  using: composite
  steps:
    # `github.action_repository` is the repository this action was resolved
    # from, so a fork that cuts its own tags and attaches its own archives is
    # served by its own releases without editing this file.
    - name: download and install the navigator CLI
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
        ACTION_REPO: ${{ github.action_repository }}
      run: |
        set -euo pipefail

        if [ -z "${VERSION}" ]; then
            echo "::error::'version' is required — pass the exact immutable release tag."
            exit 1
        fi
        # Rolling pointers are rejected rather than resolved: a job that cannot
        # name the binary it ran cannot be reproduced.
        case "${VERSION}" in
            latest|main|HEAD)
                echo "::error::'version' must be an exact release tag, not '${VERSION}'."
                exit 1
                ;;
        esac

        case "${RUNNER_OS}" in
            Linux)  platform=linux  ;;
            macOS)  platform=macos  ;;
            *)
                # Windows archives are `.zip` and ship for humans, not runners.
                # A content lint has no reason to need one.
                echo "::error::unsupported runner OS '${RUNNER_OS}' — use a Linux or macOS runner."
                exit 1
                ;;
        esac

        repo="${ACTION_REPO:-neon-law-source-code/navigator}"
        asset="navigator-${VERSION}-${platform}.tar.gz"
        tmp="$(mktemp -d)"

        echo "Downloading ${asset} from ${repo}@${VERSION}"
        if ! gh release download "${VERSION}" \
            --repo "${repo}" \
            --pattern "${asset}" \
            --dir "${tmp}" \
            --clobber; then
            echo "::error::could not download ${asset} from ${repo}. If ${repo} is private and this workflow lives in another organization, pass a PAT with contents:read as the 'token' input."
            exit 1
        fi

        # Unpack only the executable; the archive also carries LICENSE.
        tar -xzf "${tmp}/${asset}" -C "${tmp}" navigator
        install -d "${RUNNER_TEMP}/navigator-bin"
        install -m 0755 "${tmp}/navigator" "${RUNNER_TEMP}/navigator-bin/navigator"
        echo "${RUNNER_TEMP}/navigator-bin" >> "${GITHUB_PATH}"

    # `deploy.yml` bakes NAVIGATOR_RELEASE_TAG into the release build, so the
    # binary self-reports the tag it shipped from. Checking it here closes the
    # "a stale navigator on PATH shadowed the download" gap before any linting
    # happens, and is the same guard the production roll uses.
    - name: verify the installed CLI reports the pinned tag
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        reported="$(navigator --version)"
        echo "navigator --version → ${reported}"
        case "${reported}" in
            *"${VERSION}"*) ;;
            *)
                echo "::error::expected navigator ${VERSION}, got '${reported}'."
                exit 1
                ;;
        esac

    # One walk: every `.md` against the classified rule set (prose gets the
    # Markdown rules, notation templates get the N-family structural checks on
    # top), the typed event checks over each event file, and a parse of every
    # `.yaml`/`.yml`.
    - name: navigator validate
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        QUESTION_CODES_FROM_STORE: ${{ inputs.question_codes_from_store }}
        PROJECT_REPOSITORY: ${{ inputs.project_repository }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        case "${PROJECT_REPOSITORY}" in
            true)
                navigator site projects repository validate "${DIR}" --repository "${REPOSITORY}"
                ;;
            false)
                case "${QUESTION_CODES_FROM_STORE}" in
                    true)
                        navigator validate "${DIR}"
                        ;;
                    false)
                        navigator validate "${DIR}"
                        ;;
                    *)
                        echo "::error::'question_codes_from_store' must be 'true' or 'false'."
                        exit 1
                        ;;
                esac
                ;;
            *)
                echo "::error::'project_repository' must be 'true' or 'false'."
                exit 1
                ;;
        esac

    # The mount half of a Project repository's gate. It no-ops when this
    # repository carries no portal, which is why the one job can always run
    # rather than being skipped by a path filter.
    - name: the built portal is mounted where Navigator serves it
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        PROJECT_REPOSITORY: ${{ inputs.project_repository }}
        REPOSITORY: ${{ inputs.repository }}
        PORTAL_DIST: ${{ inputs.portal_dist }}
      run: |
        set -euo pipefail

        if [ "${PROJECT_REPOSITORY}" != "true" ]; then
            exit 0
        fi
        if [ ! -d "${DIR}/portal" ]; then
            echo "no portal in this repository — nothing to mount"
            exit 0
        fi

        # cloud::workspace::is_valid_slug, transcribed. Lowercase letters,
        # digits, and single hyphens; alphanumeric at both ends; at most 80.
        # Bash cannot call Rust, so cli/tests/project_gate.rs pins this block
        # against the Rust definition it mirrors.
        code="${REPOSITORY}"
        if ! printf '%s' "${code}" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,78}[a-z0-9])?$'; then
            echo "::error::'${code}' is not a valid Project code: lowercase letters, digits, and single hyphens, alphanumeric at both ends, at most 80 characters."
            exit 1
        fi
        if printf '%s' "${code}" | grep -q -- '--'; then
            echo "::error::'${code}' contains a doubled hyphen."
            exit 1
        fi
        # cloud::workspace::RESERVED_PROJECT_CODES — `/app/projects/new` is
        # Navigator's matter-open form, so it cannot also be a Project.
        if [ "${code}" = "new" ]; then
            echo "::error::'new' is a route Navigator serves itself and cannot be a Project code."
            exit 1
        fi
        # cloud::workspace::RESERVED_PROJECT_CODES — a Project code is its
        # repository name, so `navigator` would name Navigator's own source
        # rather than a matter's. A Project is never Navigator.
        if [ "${code}" = "navigator" ]; then
            echo "::error::'navigator' names Navigator's own repository and cannot be a Project code."
            exit 1
        fi

        # cloud::workspace::WorkspaceConfig::portal_mount. Nothing is composed
        # and nothing is parsed: the repository name is the code, and `portal` is
        # a literal. The trailing slash is load-bearing twice — Vite joins asset
        # URLs directly onto the base, and Navigator redirects the bare mount to
        # this form.
        base="/app/projects/${code}/portal/"

        index="${DIR}/portal/${PORTAL_DIST}/index.html"
        if [ ! -f "${index}" ]; then
            echo "::error::${index} is missing; build the portal before this gate runs."
            exit 1
        fi
        if ! grep -q "\"${base}assets/" "${index}"; then
            echo "::error::${index} is not mounted at ${base} — the base did not reach the build."
            grep -o 'src="[^"]*"' "${index}" >&2 || true
            exit 1
        fi

        # A Vite base rewrites module and asset URLs; it does not rewrite an
        # href string in source. An absolute path written by hand therefore
        # survives the build pointing outside the mount, where Navigator serves
        # something else entirely — so an in-app path must be built from
        # `import.meta.env.BASE_URL`.
        #
        # Navigator's own namespaces are the deliberate exception: a portal
        # links back to `/app/projects` and out through `/auth/logout`, and
        # those are outside the mount on purpose. Anything absolute that is
        # neither under the mount nor under `/app/` or `/auth/` is an in-app
        # path that will not survive the base.
        if matches="$(grep -rnE "(href|src|to)=\"/" \
            --include='*.ts' --include='*.tsx' --include='*.jsx' --include='*.js' \
            "${DIR}/portal/src/" 2>/dev/null \
            | grep -v "\"${base}" \
            | grep -vE "\"/(app|auth)/")"; then
            echo "::error::absolute path in source that is neither under ${base} nor a Navigator route; build an in-app path from import.meta.env.BASE_URL."
            printf '%s\n' "${matches}" >&2
            exit 1
        fi

        echo "mount ${base} — portal built and no in-app absolute path escapes it"
