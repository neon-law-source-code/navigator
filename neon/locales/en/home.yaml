head_title: "{site_name} | Home"
meta_description: >-
  A litigation firm for people who were wronged or wrongly accused, and for
  companies in a dispute. Company counsel, technology for law firms, and
  one-time filings sit beside that practice.
heading: Everyone deserves to be seen.
lead: >-
  We are litigators. We represent people who were wronged or wrongly accused,
  and companies in a dispute. We do as much as we can, as early as we can.
  That is how we work. It is not a promise about a result.
contact_label: Contact us
hero:
  alt: New York City skyline at sunset, viewed from above Lower Manhattan.
  asset: img/new-york/new-york.png
service:
  heading: The dispute comes first.
  body:
    - - text: "The "
      - text: litigation practice
        href: /litigation
      - text: >-
          is plaintiff and defense. Commercial and technology disputes for
          companies. Fraud, family, and the matters where a person's rights were
          taken and no form was written for them. The kinds of case, and the
          method, live on that page.
    - - text: >-
          Speed is how we work. A person who is not heard loses ground whether
          or not the case is close. Moving early is how we keep that from
          happening quietly. We listen, we staff the experts the matter needs,
          and we will not take a conflicted case.
    - - text: >-
          The three engagements below are for a different visitor. A company
          that needs counsel. A law firm that needs a technology function. A
          person with one scoped filing. Each has its own page, its own fee
          shape, and the same habit of writing everything down.
practices_heading: If you did not come for a dispute
practices:
  - mark: technology
    heading: Fractional CTO
    body: >-
      For law firms. We run the technology function: the architecture, the AI
      tooling, and the privacy and compliance work under both. The same systems
      we litigate on.
    href: /fractional-cto
  - mark: handshake
    heading: Fractional GC
    body: >-
      For companies. Counsel on one flat monthly fee, at the pace the sales
      cycle already runs: contracts, licences, financings, and the corporate
      advice under them.
    href: /fractional-gc
  - mark: gavel
    heading: One-Time Services
    body: >-
      For one scoped filing: a will, a trust, a formation, a trademark, an
      annual report. One scope and one flat fee, agreed before we start.
    href: /services
