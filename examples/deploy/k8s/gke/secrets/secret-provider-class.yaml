# SecretProviderClass — sync Secret Manager → the `navigator-web-secrets`
# Kubernetes Secret via the GKE-managed Secret Manager CSI driver.
#
# THE REFERENCED OBJECTS MUST EXIST BEFORE THE MOUNT
# --------------------------------------------------
# A CSI mount fails outright on any object it cannot read, and it fails at
# mount time — the pod never starts. So an object added here without a value
# in the shipping deployment's project does not degrade one feature; it takes
# the tier down. `ops ship` resolves every reference to an ENABLED
# `versions/latest` before it reconciles anything and aborts naming the gap
# (`ship::check_projected_objects_resolve`), and
# `deployments::tests::the_automation_home_supplies_every_object_the_manifest_references`
# fails the build when the tree would not write one. Values are written by
# `navigator ops secrets apply --deployment <name>`; see
# `docs/deployment-secrets.md`.
#
# This manifest is per-deployment. `ops ship` substitutes the project, the
# namespace, and the projected Secret name from the deployment being shipped,
# so the same embedded file renders one disjoint SecretProviderClass per
# deployment, each reading only its own project's Secret Manager.
# `the_rendered_secret_provider_class_is_scoped_to_one_deployment` and
# `two_deployments_render_disjoint_secret_manager_coordinates` in
# `cli/src/devx/ship.rs` fail the build if a literal is ever left behind.
#
# THE OBJECT LIST BELOW IS THE SUPERSET, NOT WHAT EVERY DEPLOYMENT MOUNTS
# ----------------------------------------------------------------------
# One list cannot state an object that is required in one deployment and
# forbidden in another. Two kinds sit here for that reason: the engineering
# webhook trio (NAVIGATOR_GITHUB_WEBHOOK_SECRET, _CANONICAL_REPOSITORY,
# _APP_LOGIN), scoped to `store::deployment::GITHUB_AUTOMATION_HOME_PROJECT`,
# and the DocuSign objects, which a deployment declines by supplying no
# DOCUSIGN_BASE_URL. So `ops ship` renders the list per deployment: it drops
# every entry `ops secrets apply` reports as skipped, from BOTH blocks, leaving
# a class that references exactly what that deployment writes
# (`ship::omit_unwritten_objects`). Add an object here when any deployment
# carries it; the rows that do not carry it render without it.
#
# The GKE add-on (`gcloud container clusters … --enable-secret-manager`)
# registers the CSI driver as `secrets-store-gke.csi.k8s.io` — NOT the
# upstream `secrets-store.csi.k8s.io`. The `provider: gke` field and
# that driver name are the GKE-specific pieces; the `SecretProviderClass`
# CRD itself is the shared `secrets-store.csi.x-k8s.io/v1` kind.
#
# The bound GSA
# `NAVIGATOR_GCP_SERVICE_ACCOUNT_ID@YOUR_PROJECT_ID.iam.gserviceaccount.com`
# already holds `roles/secretmanager.secretAccessor` (Workload Identity),
# so no new IAM is needed.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: navigator-web
  namespace: navigator
spec:
  provider: gke
  parameters:
    # One entry per Secret Manager secret. `resourceName` pins
    # `versions/latest` so a new version is picked up on the CSI
    # driver's next rotation poll (~minutes); `path` is the in-volume
    # filename that `secretObjects` below maps to a Secret key.
    secrets: |
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_PASSWORD/versions/latest"
        path: "NAVIGATOR_SURREAL_PASSWORD"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SESSION_SECRET/versions/latest"
        path: "SESSION_SECRET"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/OAUTH_CLIENT_SECRET/versions/latest"
        path: "OAUTH_CLIENT_SECRET"
      # Sign in with Microsoft, a second provider next to Google. The
      # matching OAUTH_MICROSOFT_CLIENT_ID rides inline Deployment env
      # (web-env.yaml), not this rail, since it is not key material — but a
      # deployment that sets the id is a deployment that must resolve this
      # object, or the CSI mount fails outright. A deployment that declines
      # the integration (no Entra app registered) writes no
      # OAUTH_MICROSOFT_CLIENT_SECRET, so `ops secrets apply` skips it and
      # `ops ship` renders this entry out — same as the DocuSign objects
      # below.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/OAUTH_MICROSOFT_CLIENT_SECRET/versions/latest"
        path: "OAUTH_MICROSOFT_CLIENT_SECRET"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/RESTATE_BROKER_URL/versions/latest"
        path: "RESTATE_BROKER_URL"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/RESTATE_AUTH_TOKEN/versions/latest"
        path: "RESTATE_AUTH_TOKEN"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SENDGRID_API_KEY/versions/latest"
        path: "SENDGRID_API_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SENDGRID_FROM_EMAIL/versions/latest"
        path: "SENDGRID_FROM_EMAIL"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SENDGRID_INBOUND_SECRET/versions/latest"
        path: "SENDGRID_INBOUND_SECRET"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SENDGRID_EVENTS_SECRET/versions/latest"
        path: "SENDGRID_EVENTS_SECRET"
      # Boot invariant (web::config::enforce_deployment_invariants): the ECDSA
      # P-256 public key the /webhook/email-events endpoint verifies SendGrid's
      # event signatures against. Public material, but kept on the Secret
      # rail beside SENDGRID_EVENTS_SECRET so the two events-webhook inputs
      # rotate together. Missing this crash-loops the pod.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SENDGRID_EVENTS_PUBLIC_KEY/versions/latest"
        path: "SENDGRID_EVENTS_PUBLIC_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_CREDENTIAL_ENVIRONMENT/versions/latest"
        path: "NAVIGATOR_CREDENTIAL_ENVIRONMENT"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_ENVIRONMENT/versions/latest"
        path: "NAVIGATOR_ENVIRONMENT"
      # Per-Project GitHub repos (the production ForgeService) and the folded-in
      # GitHub webhook receiver (#591): the org every repo lives in, the App creds
      # that authenticate the JWT→installation-token exchange, the HMAC webhook
      # secret, the always-watched canonical repo, the App bot login (self-event
      # suppression), and the Restate ingress the receiver submits notices to.
      # All are boot invariants (store::deployment::WEB_REQUIREMENTS); missing any
      # crash-loops web. RESTATE_AUTH_TOKEN (the ingress bearer) is declared above.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_GITHUB_ORG/versions/latest"
        path: "NAVIGATOR_GITHUB_ORG"
      # The typed Project workspace coordinates (NAVIGATOR_DRIVE_*_ROOT_FOLDER_ID
      # and the shared Drive id), the three Xero ids, and DOCUSIGN_ACCESS_TOKEN
      # are deliberately absent. A CSI mount fails outright if any object it
      # references is missing, and none of them has a value in any deployment:
      # Drive is documented but unconfigured, Xero is required only where its
      # capability is enabled, and the access token is the alternative to the
      # DocuSign JWT triple that every deployment authenticates with instead
      # (WEB_REQUIREMENTS models the pair as `any_of`, so `ops secrets apply`
      # reports the token as satisfied another way and writes nothing). Re-add
      # each alongside the deployment that first carries it, which is also what
      # keeps `ops secrets apply` able to run at all.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_FORGE_BACKEND/versions/latest"
        path: "NAVIGATOR_FORGE_BACKEND"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_GITHUB_APP_ID/versions/latest"
        path: "NAVIGATOR_GITHUB_APP_ID"
      # Not a boot invariant, so no gate demands it: absent, the App client
      # falls back to discovering the installation instead of targeting the
      # configured one.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_GITHUB_INSTALLATION_ID/versions/latest"
        path: "NAVIGATOR_GITHUB_INSTALLATION_ID"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_GITHUB_APP_PRIVATE_KEY/versions/latest"
        path: "NAVIGATOR_GITHUB_APP_PRIVATE_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_GITHUB_WEBHOOK_SECRET/versions/latest"
        path: "NAVIGATOR_GITHUB_WEBHOOK_SECRET"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_GITHUB_CANONICAL_REPOSITORY/versions/latest"
        path: "NAVIGATOR_GITHUB_CANONICAL_REPOSITORY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_GITHUB_APP_LOGIN/versions/latest"
        path: "NAVIGATOR_GITHUB_APP_LOGIN"
      # The SurrealDB coordinates. Non-secret — each deployment's
      # `config.toml` is where an operator reads and reviews them — but every
      # boot-required key that is not inline Deployment env reaches the pod
      # through this mount, so they are declared here and `ops secrets apply`
      # writes them from the plaintext tree. `web` fails closed without the
      # endpoint, and the person directory lives in that engine, so a missing
      # one cannot authenticate anyone.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_ENDPOINT/versions/latest"
        path: "NAVIGATOR_SURREAL_ENDPOINT"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_NAMESPACE/versions/latest"
        path: "NAVIGATOR_SURREAL_NAMESPACE"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_DATABASE/versions/latest"
        path: "NAVIGATOR_SURREAL_DATABASE"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_PASSWORD/versions/latest"
        path: "NAVIGATOR_SURREAL_PASSWORD"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_USER/versions/latest"
        path: "NAVIGATOR_SURREAL_USER"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_SURREAL_ARCHIVES_BUCKET/versions/latest"
        path: "NAVIGATOR_SURREAL_ARCHIVES_BUCKET"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/RESTATE_INGRESS_URL/versions/latest"
        path: "RESTATE_INGRESS_URL"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/NAVIGATOR_GIT_WRITER_TOKEN/versions/latest"
        path: "NAVIGATOR_GIT_WRITER_TOKEN"
      # Bot token for target-aware per-Project private-channel notices. This is
      # distinct from SLACK_WEBHOOK_URL, which remains the fixed-destination
      # internal ops notifier.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/SLACK_BOT_TOKEN/versions/latest"
        path: "SLACK_BOT_TOKEN"
      # DocuSign identity and verification material: the JWT triple
      # (INTEGRATION_KEY + USER_ID + PRIVATE_KEY), its endpoints, and the two
      # Connect webhook inputs.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_BASE_URL/versions/latest"
        path: "DOCUSIGN_BASE_URL"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_ACCOUNT_ID/versions/latest"
        path: "DOCUSIGN_ACCOUNT_ID"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_INTEGRATION_KEY/versions/latest"
        path: "DOCUSIGN_INTEGRATION_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_USER_ID/versions/latest"
        path: "DOCUSIGN_USER_ID"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_PRIVATE_KEY/versions/latest"
        path: "DOCUSIGN_PRIVATE_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_OAUTH_BASE/versions/latest"
        path: "DOCUSIGN_OAUTH_BASE"
      # Not a boot invariant, and `portal::signature` defaults it to a
      # retired-brand address when unset — so losing it degrades silently
      # rather than failing. It rides the Secret rail for that reason.
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_SIGNER_EMAIL/versions/latest"
        path: "DOCUSIGN_SIGNER_EMAIL"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_HMAC_KEY/versions/latest"
        path: "DOCUSIGN_HMAC_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/DOCUSIGN_WEBHOOK_SECRET/versions/latest"
        path: "DOCUSIGN_WEBHOOK_SECRET"
  # Project each mounted file into the `navigator-web-secrets` Secret
  # under the env-var key `web` (and `workflows-service`) read via
  # `envFrom`. This set MUST carry every boot-required Secret key in
  # `store::deployment::WEB_REQUIREMENTS`: the
  # `secret_provider_class_declares_every_boot_required_secret_key` test in
  # `cli/src/devx/ship.rs` fails the build if a required key is missing here.
  secretObjects:
    - secretName: navigator-web-secrets
      type: Opaque
      labels:
        navigator.neonlaw.org/environment: production
      data:
        - objectName: "NAVIGATOR_SURREAL_PASSWORD"
          key: "NAVIGATOR_SURREAL_PASSWORD"
        - objectName: "SESSION_SECRET"
          key: "SESSION_SECRET"
        - objectName: "OAUTH_CLIENT_SECRET"
          key: "OAUTH_CLIENT_SECRET"
        - objectName: "OAUTH_MICROSOFT_CLIENT_SECRET"
          key: "OAUTH_MICROSOFT_CLIENT_SECRET"
        - objectName: "RESTATE_BROKER_URL"
          key: "RESTATE_BROKER_URL"
        - objectName: "RESTATE_AUTH_TOKEN"
          key: "RESTATE_AUTH_TOKEN"
        - objectName: "SENDGRID_API_KEY"
          key: "SENDGRID_API_KEY"
        - objectName: "SENDGRID_FROM_EMAIL"
          key: "SENDGRID_FROM_EMAIL"
        - objectName: "SENDGRID_INBOUND_SECRET"
          key: "SENDGRID_INBOUND_SECRET"
        - objectName: "SENDGRID_EVENTS_SECRET"
          key: "SENDGRID_EVENTS_SECRET"
        - objectName: "SENDGRID_EVENTS_PUBLIC_KEY"
          key: "SENDGRID_EVENTS_PUBLIC_KEY"
        - objectName: "NAVIGATOR_CREDENTIAL_ENVIRONMENT"
          key: "NAVIGATOR_CREDENTIAL_ENVIRONMENT"
        - objectName: "NAVIGATOR_ENVIRONMENT"
          key: "NAVIGATOR_ENVIRONMENT"
        - objectName: "NAVIGATOR_GITHUB_ORG"
          key: "NAVIGATOR_GITHUB_ORG"
        - objectName: "NAVIGATOR_FORGE_BACKEND"
          key: "NAVIGATOR_FORGE_BACKEND"
        - objectName: "NAVIGATOR_GITHUB_APP_ID"
          key: "NAVIGATOR_GITHUB_APP_ID"
        - objectName: "NAVIGATOR_GITHUB_INSTALLATION_ID"
          key: "NAVIGATOR_GITHUB_INSTALLATION_ID"
        - objectName: "NAVIGATOR_GITHUB_APP_PRIVATE_KEY"
          key: "NAVIGATOR_GITHUB_APP_PRIVATE_KEY"
        - objectName: "NAVIGATOR_GITHUB_WEBHOOK_SECRET"
          key: "NAVIGATOR_GITHUB_WEBHOOK_SECRET"
        - objectName: "NAVIGATOR_GITHUB_CANONICAL_REPOSITORY"
          key: "NAVIGATOR_GITHUB_CANONICAL_REPOSITORY"
        - objectName: "NAVIGATOR_GITHUB_APP_LOGIN"
          key: "NAVIGATOR_GITHUB_APP_LOGIN"
        - objectName: "NAVIGATOR_SURREAL_ENDPOINT"
          key: "NAVIGATOR_SURREAL_ENDPOINT"
        - objectName: "NAVIGATOR_SURREAL_NAMESPACE"
          key: "NAVIGATOR_SURREAL_NAMESPACE"
        - objectName: "NAVIGATOR_SURREAL_DATABASE"
          key: "NAVIGATOR_SURREAL_DATABASE"
        - objectName: "NAVIGATOR_SURREAL_PASSWORD"
          key: "NAVIGATOR_SURREAL_PASSWORD"
        - objectName: "NAVIGATOR_SURREAL_USER"
          key: "NAVIGATOR_SURREAL_USER"
        - objectName: "NAVIGATOR_SURREAL_ARCHIVES_BUCKET"
          key: "NAVIGATOR_SURREAL_ARCHIVES_BUCKET"
        - objectName: "RESTATE_INGRESS_URL"
          key: "RESTATE_INGRESS_URL"
        - objectName: "NAVIGATOR_GIT_WRITER_TOKEN"
          key: "NAVIGATOR_GIT_WRITER_TOKEN"
        - objectName: "SLACK_BOT_TOKEN"
          key: "SLACK_BOT_TOKEN"
        - objectName: "DOCUSIGN_BASE_URL"
          key: "DOCUSIGN_BASE_URL"
        - objectName: "DOCUSIGN_ACCOUNT_ID"
          key: "DOCUSIGN_ACCOUNT_ID"
        - objectName: "DOCUSIGN_INTEGRATION_KEY"
          key: "DOCUSIGN_INTEGRATION_KEY"
        - objectName: "DOCUSIGN_USER_ID"
          key: "DOCUSIGN_USER_ID"
        - objectName: "DOCUSIGN_PRIVATE_KEY"
          key: "DOCUSIGN_PRIVATE_KEY"
        - objectName: "DOCUSIGN_OAUTH_BASE"
          key: "DOCUSIGN_OAUTH_BASE"
        - objectName: "DOCUSIGN_SIGNER_EMAIL"
          key: "DOCUSIGN_SIGNER_EMAIL"
        - objectName: "DOCUSIGN_HMAC_KEY"
          key: "DOCUSIGN_HMAC_KEY"
        - objectName: "DOCUSIGN_WEBHOOK_SECRET"
          key: "DOCUSIGN_WEBHOOK_SECRET"
