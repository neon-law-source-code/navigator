name: ghcr retention

# THE ONLY WORKFLOW IN THIS REPOSITORY THAT DELETES A PUBLISHED ARTIFACT.
#
# Every other workflow adds — images, archives, check runs. This one removes, on
# a clock, unattended, and what it removes does not come back: a deleted GHCR
# container version is gone, and `navigator ops ship` refuses a tag the registry
# no longer holds, which is the documented rollback path. So the interesting part
# of this file is not what it deletes but what it CANNOT.
#
# Retention used to be count-only and enforced nowhere this registry can see:
# `navigator ops gcp hub setup` PATCHes an Artifact Registry repository's
# `cleanupPolicies` to keep the last ten versions, and every image now lives on
# `ghcr.io`, which never reads them. GHCR offers no server-side retention rule at
# all, so a workflow is the only place it can live.
#
# THREE INDEPENDENT FLOORS, and a version has to clear all three to be deleted:
#
#   1. AGE — older than CUTOFF_DAYS.
#   2. COUNT — outside its own image's newest RETAINED_VERSIONS. This is the half
#      that cannot expire, and it is why the sweep is safe now that publishing
#      runs from a tag rather than a nightly cron. Under the cron every running
#      version was a day old, so an age rule could never reach one; with releases
#      driven by tags a quiet month is ordinary, and age alone would delete the
#      exact versions production is running. Serving pods survive that — they
#      already pulled — but a restart, a reschedule, or a node replacement cannot
#      pull an image that is gone.
#   3. NOT `latest` — every publish moves that pointer, and deleting what it
#      points at leaves a tag resolving to nothing. That failure surfaces at pull
#      time, in a cluster, not here.
#
# AND ONE SCOPE BOUND: a GHCR package is owned by the ORG, not the repository, so
# the org also owns packages this repository never published. The sweep therefore
# NAMES the packages it may touch, below, rather than discovering them — an
# explicit list cannot widen on its own, and `cli/tests/ghcr_retention.rs` holds
# it equal to the images `deploy.yml` actually publishes, so a new image joins
# the sweep in the same commit that starts publishing it.
#
# Naming them is also what lets the credential stay the run's own `GITHUB_TOKEN`.
# `GET /orgs/{org}/packages` — the discovery call — is reachable only by a
# classic PAT holding `read:packages`; an Actions token gets a 403 no permissions
# block can grant. The per-package VERSION LISTING is a different lane, and the
# run's own token reaches it. So there is no PAT, nothing to rotate, and no
# cloud provider: GHCR is the only registry.
#
# DELETING needs one grant this file cannot make. Publishing an image with
# `GITHUB_TOKEN` links the package to this repository and gives it the `write`
# role, which uploads and downloads and CANNOT delete — only `admin` deletes.
# `admin` is granted per package under Package settings → "Manage Actions
# access", no REST API sets it, and `packages: write` below is the ceiling of
# what a permissions block can even ask for. So that grant is a real
# out-of-band precondition of this sweep: without it every delete answers
# `404 Package not found`, which is also what a version another run already
# removed answers — the ambiguity that let this sweep read as noise for five
# consecutive nights while deleting nothing. The failure branch at the foot of
# the script tells those two 404s apart, because nothing else can.
#
# Rehearse a change with the dispatch before a night runs it live —
# `dry_run: true` lists every deletion it would make and deletes nothing. It
# proves the three floors, the package list, and the shape of the run. It
# CANNOT prove the grant above, because it issues no DELETE at all, and GHCR
# publishes no endpoint that asks whether one would be authorized. So a green
# rehearsal is a statement about this file, never about the role — the first
# and only place a lapsed grant can surface is a live sweep with something due.

on:
  schedule:
    # 01:11 UTC. An odd minute rather than :00, because the top of the hour is
    # when GitHub's hosted-runner queue is deepest and a scheduled run is
    # delayed, not queued fairly. This is the slot the nightly release train
    # held before publishing moved off the nightly clock.
    - cron: "11 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Report what would be deleted and delete nothing. The safe way to prove
          a change to this workflow — but it issues no DELETE, so it proves the
          floors and the package list and never the package `admin` grant.
        type: boolean
        default: true

permissions: {}

concurrency:
  # Two sweeps racing would both list, both decide, and both delete against a
  # registry the other is mutating. Serialize, and never cancel a run
  # mid-delete — a half-applied sweep is harder to reason about than a late one.
  group: ghcr-retention
  cancel-in-progress: false

jobs:
  sweep:
    name: prune GHCR versions older than 30 days
    # A fork must never prune the upstream org's packages.
    if: github.repository == 'neon-law-source-code/navigator'
    runs-on: ubuntu-latest
    # Deleting a version is the whole grant. In particular NOT `contents:
    # write` — this job prunes a registry, and nothing in this repository's
    # automation may move a ref.
    permissions:
      packages: write
    # A sweep is a few hundred API calls. Cap it so a paging bug that never
    # terminates cannot hold the concurrency group open indefinitely.
    timeout-minutes: 20
    steps:
      - name: prune container versions
        id: sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          # An empty `inputs.dry_run` is a scheduled run, which sweeps for real.
          # The dispatch defaults it to `true`, so the manual path is the safe
          # one and the automatic path is the deliberate one.
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail

          # Delete nothing newer than this, and never fewer than this many of
          # each image's newest versions. `cli/tests/ghcr_retention.rs` asserts
          # both literals — they are the floors, so they are guarded rather than
          # reviewed.
          CUTOFF_DAYS=30
          RETAINED_VERSIONS=10

          cutoff="$(date -u -d "${CUTOFF_DAYS} days ago" +%s)"
          echo "cutoff: $(date -u -d "@${cutoff}" +'%Y-%m-%dT%H:%M:%SZ') (${CUTOFF_DAYS} days ago)"
          echo "floor:  newest ${RETAINED_VERSIONS} versions of every image, plus whatever carries \`latest\`"
          echo "dry run: ${DRY_RUN}"
          echo

          # THE PACKAGES THIS SWEEP MAY TOUCH, named rather than discovered.
          #
          # Every entry is an image `deploy.yml` publishes: the `image` and
          # `alias` of each `publish-service` matrix leg, and the `image` of each
          # `publish-triggers` leg. `cli/tests/ghcr_retention.rs` parses those
          # matrices and asserts this list equals them exactly, so a new image
          # cannot start publishing without joining the sweep, and a name that
          # stops being published cannot linger here pointing at some other
          # repository's package.
          #
          # It is a literal list because the discovery call it replaces is
          # unreachable: `GET /orgs/{org}/packages` requires a classic PAT with
          # `read:packages`, and `GITHUB_TOKEN` is answered 403 however the
          # permissions block is written. Naming the packages removes the call
          # instead of adding a credential — and it is a stricter scope bound
          # than the filter it replaces, because a wrong repository link could
          # never widen it.
          PACKAGES="
          neon-server
          navigator-web
          navigator-workflows-service
          navigator-gateway
          navigator-heartbeat-trigger
          navigator-archives-trigger
          navigator-surreal-archive
          navigator-reconcile-invoices-trigger
          navigator-billing-digest-trigger
          navigator-dri-digest-trigger
          navigator-runner
          "
          count="$(printf '%s\n' ${PACKAGES} | wc -w | tr -d ' ')"
          echo "packages published by ${OWNER}/${REPO_NAME}: ${count}"
          echo

          deleted=0
          kept=0
          failed=0
          # What the three floors SELECTED, before any of it was spent. See the
          # summary at the foot of the script for why this is reported.
          eligible=0

          for package in ${PACKAGES}; do
              encoded="${package//\//%2F}"
              # Newest first, so the index IS the count floor: the first
              # RETAINED_VERSIONS entries are exempt whatever their age.
              #
              # A package this repository publishes but has not published YET is
              # a 404 rather than an error: the list is the set of images
              # `deploy.yml` can push, and a newly added one has no versions
              # until its first release. FAIL on anything else, because "no
              # versions" and "could not look" must not report the same way.
              #
              # `--slurp` wraps the pages in one array; the shaping runs in a
              # SEPARATE `jq` because `gh api` refuses `--slurp` and `--jq`
              # together ("the `--slurp` option is not supported with `--jq`").
              # That refusal is an argument error, not an API error, so it
              # cannot be told apart from a real failure by status code — keep
              # the two steps apart rather than reuniting them.
              if ! pages="$(gh api --paginate --slurp \
                  "/orgs/${OWNER}/packages/container/${encoded}/versions?per_page=100" \
                  2>/tmp/versions.err)"; then
                  if grep -q 'HTTP 404' /tmp/versions.err; then
                      echo "${package}: not published yet, skipping"
                      continue
                  fi
                  echo "::error::could not list versions of ${package}."
                  cat /tmp/versions.err >&2
                  exit 1
              fi
              versions="$(printf '%s' "${pages}" \
                  | jq '[.[][]] | sort_by(.created_at) | reverse')"
              total="$(printf '%s' "${versions}" | jq 'length')"

              # One jq pass applies all three floors — count, then age, then the
              # `latest` exemption — and emits only the ids that clear every one.
              # Keeping the decision in a single expression beats spreading it
              # across a bash loop with three `continue`s, where a reader has to
              # reconstruct which conditions compose.
              #
              # It emits a JSON ARRAY so the count and the iteration below read
              # the same list. Counting a raw newline-delimited blob would mean
              # `grep -c`, which exits 1 on no match — and an empty candidate
              # list is the COMMON case, so under `set -e` the quiet, correct
              # outcome would become a failed sweep that pages.
              doomed="$(printf '%s' "${versions}" | jq -c \
                  --argjson keep "${RETAINED_VERSIONS}" \
                  --argjson cutoff "${cutoff}" '
                  to_entries
                  | map(select(.key >= $keep))
                  | map(select((.value.created_at | fromdateiso8601) < $cutoff))
                  | map(select((.value.metadata.container.tags // []) | index("latest") | not))
                  | map(.value.id)
              ')"

              doomed_count="$(printf '%s' "${doomed}" | jq 'length')"
              kept=$((kept + total - doomed_count))
              eligible=$((eligible + doomed_count))
              echo "${package}: ${total} versions, ${doomed_count} eligible for deletion"

              if [ "${doomed_count}" -eq 0 ]; then
                  continue
              fi

              for id in $(printf '%s' "${doomed}" | jq -r '.[]'); do
                  if [ "${DRY_RUN}" = "true" ]; then
                      echo "  would delete ${package} version ${id}"
                      continue
                  fi
                  # A failed delete must not abandon the rest of the sweep: one
                  # 404 from a version another run already removed would
                  # otherwise leave every later package unpruned, and the run
                  # would report the failure without saying how much it skipped.
                  if gh api --method DELETE \
                      "/orgs/${OWNER}/packages/container/${encoded}/versions/${id}" \
                      --silent; then
                      echo "  deleted ${package} version ${id}"
                      deleted=$((deleted + 1))
                  else
                      echo "::warning::could not delete ${package} version ${id}"
                      failed=$((failed + 1))
                  fi
              done
          done

          echo
          # REPORT WHAT WAS DUE, not only what was spent. `0 deleted, 0
          # failed` is the summary of a healthy sweep with nothing old enough
          # to prune AND of a sweep whose filters silently matched nothing, and
          # #navigator sees this line and no other — the per-package counts
          # above sit in a run log nobody opens at 01:11 UTC. Two issues were
          # filed a fortnight apart against that ambiguity, both reading a
          # correct quiet night as the broken one that preceded it. The due
          # count separates them without needing the log: `0 due` is the
          # registry holding nothing that clears the floors, while `N due, 0
          # deleted` is a sweep that decided and could not act.
          if [ "${DRY_RUN}" = "true" ]; then
              summary="dry run over ${count} images: ${eligible} versions due, ${kept} kept, deletions listed above only"
          else
              summary="${count} images swept: ${eligible} versions due, ${deleted} deleted, ${kept} kept, ${failed} failed"
          fi
          echo "${summary}"
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"
          # A sweep that could not delete anything it decided to delete has not
          # done its job, and the warnings above scroll away. Fail so the page
          # below fires.
          if [ "${failed}" -gt 0 ]; then
              if [ "${deleted}" -eq 0 ]; then
                  # NOTHING was deleted, which is not the shape of a stale
                  # version — those are one-offs, and a run that raced another
                  # still prunes everything else. A uniform failure is the
                  # missing `admin` role, so name that grant and where it
                  # lives rather than leaving the next reader to re-derive it
                  # from a 404 that also has an innocent meaning.
                  echo "::error::all ${failed} deletions failed and nothing was deleted — this is the package role, not the registry. Grant ${OWNER}/${REPO_NAME} the admin role on each swept package under Package settings → Manage Actions access; publishing inherits write, which cannot delete."
              else
                  echo "::error::${failed} deletions failed"
              fi
              exit 1
          fi

      # Identifiers and counts, never content — the same rule that binds the
      # release reports. This body carries image counts and a run URL.
        # Quoted: an unquoted `#` starts a YAML comment, which would silently
        # truncate this name to "report the sweep to".
      - name: "report the sweep to #navigator"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUMMARY: ${{ steps.sweep.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
              echo "::notice::SLACK_WEBHOOK_URL is unset — skipping the sweep report"
              exit 0
          fi
          TEXT=":broom: *GHCR retention* — ${SUMMARY}
          Run: ${RUN_URL}"
          PAYLOAD=$(jq -n --arg text "${TEXT}" '{ text: $text }')
          code=$(curl -sS --max-time 15 -o /tmp/slack-sweep.out -w '%{http_code}' \
              -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}") || code="000"
          if [ "${code}" != "200" ]; then
              # A warning, never an error: the sweep already happened, and
              # failing the job over its own narration would page for a
              # successful prune.
              echo "::warning::#navigator sweep report failed (${code})"
              cat /tmp/slack-sweep.out 2>/dev/null || true
              exit 0
          fi
          echo "sweep report posted to #navigator"

      # THE PAGE. A scheduled destructive job that fails silently is
      # indistinguishable from one that never ran — and this one's quiet failure
      # mode is worse than a red build: images simply stop being pruned, or are
      # pruned wrongly, and no check anywhere goes red. A silent nightly failure
      # went unnoticed for four consecutive nights once; this is the guard
      # against the same shape.
      - name: "page #navigator on a failed sweep"
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_OPS_MENTION: ${{ secrets.SLACK_OPS_MENTION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
              # Annotate, but do NOT exit non-zero. This step runs only because
              # an earlier one already failed, so the job's conclusion is red
              # either way — and a second failure here becomes the LAST error in
              # the log, which is the one a reader sees first. A missing webhook
              # then reads as the cause of the sweep's failure instead of a
              # missing narration of it. `deploy.yml` treats the same absent
              # secret the same way, for the same reason.
              echo "::error::SLACK_WEBHOOK_URL is unset — the sweep failed above and could not be paged"
              exit 0
          fi
          TEXT=":x: GHCR retention sweep failed — ${SLACK_OPS_MENTION} please investigate. Published images may not have been pruned.
          Run: ${RUN_URL}"
          PAYLOAD=$(jq -n --arg text "${TEXT}" '{ text: $text }')
          curl -sS --max-time 15 -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}" || echo "::warning::the failure page itself could not be posted"
