# The shared public marketing catalog.
#
# Every sentence here is published by both this repository and
# `neon-law-source-code/navigator-ux`. Navigator's page catalogs reference a
# key with `{shared:<key>}` rather than repeating the words, and navigator-ux
# consumes the exported catalog pinned to one Navigator revision.
#
# Rules, enforced by `views::locales::shared` through `navigator project gate`
# (`Y002`): the version is explicit, every key in `REQUIRED_KEYS` must be
# present, a value is one line with no double quote, and the only placeholders
# are `{site_name}` and `{firm_email}`.
#
# Copy that differs between the two renderers today is deliberately *not*
# here. This catalog removes duplication; it does not decide wording.
catalog_version: 1

entries:
  # `/` — the question the home page opens on.
  home.need_prompt: What is your legal need?
  home.mission_heading: Everyone deserves to be seen.
  home.mission_north_star: Our north star is improving access to justice.
  home.mission_promise: You deserve a lawyer who listens, explains your options, and tells you what help will cost.

  # `/services`
  services.eyebrow: One-time services
  services.title: Find the help you need.
  services.lede: Choose a plan for regular help, or ask us about a single service.
  services.subscriptions_heading: A lawyer you can turn to.
  services.catalog_heading: Need help with one thing?

  # `/business` — the Business plan.
  fractional_gc.eyebrow: Business plan
  fractional_gc.title: The legal library for your business.
  fractional_gc.lede: Use our contract library and name Neon Law as your counsel for work we agree to handle.
  fractional_gc.price: $10
  # `/personal`
  personal_plan.eyebrow: Personal plan
  personal_plan.title: Help with the things you need to take care of.
  personal_plan.price: $365
  personal_plan.included.data_removal: Help asking companies to remove your personal information
  personal_plan.included.credit_monitoring: Optional credit monitoring

  # `/disputes`
  litigation.eyebrow: Help with a dispute
  litigation.title: Your story deserves to be heard.
  litigation.lede: Start with a free consultation. Tell us what happened, what you need, and whether you have a deadline.
  litigation.cta: Request a free consultation
  litigation.cases_help_others: We care about cases that can make life better for you and for others facing the same problem.

  # Lead capture
  lead.consent: By sending this, you agree that {site_name} may email you about this inquiry. Sending it does not make you a client, and nothing on this page is legal advice. See our Privacy Policy.
  lead.phone_helper: Optional. If you add a mobile number and check the box, {site_name} may text you about this inquiry. Message and data rates may apply. Reply STOP to stop, HELP for help. See the text-messaging terms.
