head_title: "{site_name} | We attend your OATH hearing for $50"
meta_description: >-
  A licensed attorney appears at your OATH hearing by phone for $50 flat —
  Shook Law PLLC defends New York City summonses for property owners,
  managing agents, restaurants, and contractors. A private law firm, not
  affiliated with the City of New York or OATH. This is an attorney
  advertisement.
heading: We attend your hearing. You don't have to.
lead: >-
  A licensed attorney appears at your OATH hearing by phone for $50 flat, no
  retainer required. Shook Law PLLC is a private law firm. We are not
  affiliated with the City of New York or with the Office of Administrative
  Trials and Hearings. Nothing here is legal advice without a signed
  retainer for an active project.
contact_label: Contact us
service:
  heading: What this practice does
  body:
    - - text: >-
          The OATH Hearings Division hears summonses written by City
          enforcement agencies, including Buildings, Sanitation,
          Environmental Protection, Consumer and Worker Protection, Health
          and Mental Hygiene, and the Taxi and Limousine Commission. OATH
          does not write summonses and does not inspect. It decides them.
    - - text: >-
          Hearings are informal, and most are held by telephone. The hearing
          officer may only consider what is presented at the hearing. That
          is the whole point of being represented: the permit, the invoice,
          the repair record, and the photographs have to actually be put in
          front of the hearing officer, at the right time, by someone whose
          job that is.
    - - text: >-
          For $50, an attorney appears at your telephone hearing, presents
          what you send us beforehand, and reports back what happened. No
          retainer, no consultation required first — send the summons and
          your evidence, and we take the call.
    - - text: >-
          A hearing officer can dismiss the summons, give cure credit,
          reduce the penalty, or uphold it. Either side has thirty days to
          appeal to the Appeals Unit, including the agency.
    - - text: >-
          If a hearing is missed, the summons goes into default, and
          defaults are expensive: liens, civil judgments, Sheriff or Marshal
          action, and exposure to losing a City license, permit, or
          registration. A new hearing may be requested once per summons, and
          it is granted automatically when the request is filed within 75
          days of the missed hearing.
    - - text: >-
          Property owners, managing agents, restaurants, and contractors
          with summonses on a recurring basis can retain us monthly across a
          portfolio instead of paying per hearing. OATH tells respondents
          they do not need a lawyer and runs a free Help Center at every
          hearing location; for one summons that is often the right answer.
          We are worth paying when a hearing is worth showing up for and you
          cannot.
    - - text: "Write to "
      - text: "{firm_email}"
        href: "mailto:{firm_email}"
      - text: >-
          . Tell us your hearing date, which agency wrote the summons, and
          send what you want said on the record.
practices_heading: The work
