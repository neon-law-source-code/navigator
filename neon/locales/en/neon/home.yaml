head_title: "{site_name} | Home"
meta_description: >-
  Neon Law is flat-fee counsel for emerging technology companies. Name us as
  your fractional general counsel, ask about an individual service, or start a
  free consultation for a dispute.
heading: "{shared:home.need_prompt}"
lead: >-
  We work with software, AI, and other technology companies at an early stage.
  Tell us whether you need ongoing counsel, a single contract or filing, or
  help with a dispute. If you are not sure where to start, contact us and we
  will help you find the next step.
contact_label: Contact us
service:
  heading: "{shared:home.mission_heading}"
  body:
    - - text: "{shared:home.mission_north_star} {shared:home.mission_promise}"
    - - text: "Name us as your "
      - text: fractional general counsel
        href: /business
      - text: " for ongoing work — contract-library access and a counsel relationship for the work we agree to handle."
    - - text: "Need one thing? See our "
      - text: individual services
        href: /services
      - text: >-
          . An unchanged template can be sent for signature for $5; a Notation
          we prepare or revise begins at $100. Government fees may be separate.
    - - text: "If your company has a dispute, start with a "
      - text: free consultation
        href: /disputes
      - text: ". You do not need a subscription for that first conversation."
practices_heading: Choose the help that fits.
practices:
  - mark: handshake
    heading: Fractional general counsel
    body: >-
      Contract-library access at $50 a day, then a la carte Notations for the
      documents you need.
    href: /business
  - mark: gavel
    heading: Individual services
    body: >-
      Ask about a single form, filing, contract review, or other legal service.
    href: /services
  - mark: scales
    heading: Disputes
    body: >-
      Commercial, IP, employment, and investor disputes. Tell us what happened
      in a free consultation.
    href: /disputes
