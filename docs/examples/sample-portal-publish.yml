# Example `cd.yml` for a Project repository. New repositories should use
# `navigator project repository scaffold`, which writes this shape.
# The shared workflow owns build, validation, and publication; the repository
# names only its own Project and deployment host.

name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    uses: neon-law-source-code/navigator/.github/workflows/project-gate.yml@26.9.14
    with:
      project: "example-project"
      host: "staging.neonlaw.com"
  publish:
    needs: gate
    uses: neon-law-source-code/navigator/.github/workflows/project-publish.yml@26.9.14
    with:
      project: "example-project"
      host: "staging.neonlaw.com"
