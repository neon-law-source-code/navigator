name: project-publish

# The reusable publication half of a Project repository. The Project code and
# deployment host both come from the checkout's own navigator.yaml — the
# caller passes nothing. Publisher credentials remain deployment
# configuration.

on:
  workflow_call:
    inputs:
      project:
        description: >-
          Deprecated, ignored: the Project code is read from navigator.yaml's
          project.name. Kept only so an unmigrated caller's `with:` block does
          not fail workflow_call's undeclared-input check; remove it from
          callers and then from here.
        required: false
        type: string
        default: ""
      host:
        description: >-
          Deprecated, ignored: the deployment host is read from
          navigator.yaml's project.host. Kept only so an unmigrated caller's
          `with:` block does not fail workflow_call's undeclared-input check;
          remove it from callers and then from here.
        required: false
        type: string
        default: ""

# Workflow-level `concurrency` cannot read a file, so it keys on the caller
# repository rather than the resolved Project code — the two agree, since a
# Project repository publishes exactly one Project.
concurrency:
  group: project-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  read-manifest:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.manifest.outputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read navigator.yaml
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          project="$(ruby -e 'require "yaml"; m = YAML.safe_load(File.read("navigator.yaml"), aliases: false) || {}; p = m["project"]; p = {} unless p.is_a?(Hash); name = p["name"]; abort("navigator.yaml is missing project.name") unless name.is_a?(String) && !name.strip.empty?; puts name.strip')"
          echo "project=${project}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: read-manifest
    if: vars.NAVIGATOR_APP_PUBLISHER_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # See the matching comment in project-gate.yml's `verify` job: this pin
      # lags until a release publishes the action. No `version:` input here —
      # this workflow reads no manifest of its own, so it takes the default,
      # navigator.yaml's own version.
      - uses: neon-law-source-code/navigator/.github/actions/navigator-install@26.9.25
      # Application discovery lives in the CLI (`cli/src/projects/repository.rs`)
      # now, not in this workflow. `dist_dir` is a plain path-suffix trim of
      # the manifest the CLI already resolved, not a second detection pass.
      - name: locate the application manifest
        id: application
        run: |
          manifest="$(navigator project applications --manifest)"
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"
          if [ -n "${manifest}" ]; then
              echo "dist_dir=${manifest%/package.json}/dist" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.application.outputs.manifest != ''
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.application.outputs.manifest != ''
        with:
          package_json_file: ${{ steps.application.outputs.manifest }}
      # Installs, lints, typechecks, tests, and builds every discovered
      # application, one at a time, stopping at the first failure. A
      # repository with none prints a notice and succeeds.
      - name: navigator project build
        run: navigator project build --dir .
      # No validate step here. `project-gate.yml` has already validated this
      # commit — `cd.yml` makes the gate a `needs:` of the publish job — and a
      # second pass pinned to a fixed release validates the repository with a
      # CLI that is not the one `navigator.yaml` selects. That is not a
      # theoretical mismatch: pinned at 26.9.14 it rejected the nested manifest
      # this very release introduced, with Y004, Y005, and Y006 on a file the
      # gate had just accepted, and every Project portal stopped publishing
      # while the required check stayed green.
      # The applications bucket is deployment configuration, never derived
      # from `host`: provisioning names it independently
      # (`cli::devx::gcp::BucketNames::applications`, `<project_id>-applications`
      # by default) and the publisher's IAM grant is conditioned on that exact
      # name (`cli::devx::gcp::app_publisher::ensure_publisher_grant`). A host
      # carries no GCP project id, so no string transform of it can be trusted
      # to land on the bucket the grant actually names.
      - uses: neon-law-source-code/navigator/.github/actions/application-publish@26.9.25
        if: steps.application.outputs.dist_dir != ''
        with:
          applications_bucket: ${{ vars.NAVIGATOR_APP_PUBLISHER_BUCKET }}
          workload_identity_provider: ${{ vars.NAVIGATOR_APP_PUBLISHER_WIF_PROVIDER }}
          service_account: ${{ vars.NAVIGATOR_APP_PUBLISHER_SERVICE_ACCOUNT }}
          repository: ${{ needs.read-manifest.outputs.project }}
          dist_dir: ${{ steps.application.outputs.dist_dir }}
